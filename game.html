<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的店 · 经营模拟</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10;
    --bg2:#11141c;
    --panel:#141821;
    --text:#d0d4e0;
    --dim:#6b7180;
    --green:#39ff7a;
    --green-dim:#1a8c44;
    --red:#ff3b5c;
    --red-dim:#8c1f2f;
    --amber:#ffb627;
    --border:rgba(255,255,255,0.08);
    --px:"Press Start 2P",monospace;
    --vt:"VT323",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--vt);font-size:20px;line-height:1.4;
    image-rendering:pixelated;-webkit-font-smoothing:none;
    display:flex;align-items:center;justify-content:center;
    background-image:
      linear-gradient(rgba(57,255,122,0.02) 50%,transparent 50%),
      radial-gradient(800px 400px at 50% 0%,rgba(57,255,122,0.05),transparent 70%);
    background-size:100% 4px,100% 100%;
  }
  ::selection{background:var(--green);color:#000}

  #app{
    width:min(960px,96vw);height:min(680px,92vh);
    border:1px solid var(--border);background:var(--bg);
    box-shadow:0 0 0 1px rgba(57,255,122,0.05),0 30px 80px rgba(0,0,0,0.8);
    position:relative;display:flex;flex-direction:column;overflow:hidden;
  }
  /* CRT scanlines */
  #app::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0.12) 0,rgba(0,0,0,0.12) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:multiply;
  }

  /* ===== Title bar ===== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;border-bottom:1px solid var(--border);
    background:var(--bg2);font-family:var(--px);font-size:9px;color:var(--dim);
  }
  .topbar .dots{display:flex;gap:6px}
  .topbar .dots i{width:9px;height:9px;border-radius:50%;display:block}
  .topbar .dots i:nth-child(1){background:#ff5f56}
  .topbar .dots i:nth-child(2){background:#ffbd2e}
  .topbar .dots i:nth-child(3){background:var(--green)}
  .topbar .title{color:var(--green);letter-spacing:1px}

  /* ===== HUD ===== */
  .hud{
    display:grid;grid-template-columns:repeat(6,1fr);gap:1px;
    background:var(--border);border-bottom:1px solid var(--border);
    font-family:var(--px);font-size:8px;
  }
  .stat{background:var(--panel);padding:9px 10px;display:flex;flex-direction:column;gap:5px}
  .stat .k{color:var(--dim);letter-spacing:1px}
  .stat .v{font-size:13px;color:var(--text)}
  .stat.good .v{color:var(--green)}
  .stat.bad .v{color:var(--red)}
  .stat.warn .v{color:var(--amber)}
  .bar{height:3px;background:rgba(255,255,255,0.06);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green);transition:width .6s ease}
  .stat.bad .bar i{background:var(--red)}
  .stat.warn .bar i{background:var(--amber)}

  /* ===== Stage ===== */
  .stage{flex:1;position:relative;overflow:hidden}
  .scene{position:absolute;inset:0;display:none;flex-direction:column;padding:24px 28px;overflow-y:auto}
  .scene.active{display:flex;animation:fadeIn .5s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== Typewriter ===== */
  .typewriter{font-size:22px;color:var(--text);white-space:pre-wrap;min-height:1.4em}
  .typewriter .cursor{display:inline-block;width:10px;height:20px;background:var(--green);animation:blink 1s steps(1) infinite;vertical-align:-3px;margin-left:2px}
  @keyframes blink{50%{opacity:0}}
  .typewriter .hl{color:var(--green)}
  .typewriter .hl-r{color:var(--red)}
  .typewriter .hl-a{color:var(--amber)}

  /* ===== Pixel scene ===== */
  .pixel-room{
    flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:180px;
  }
  .room-bg{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg,#1a2030 0%,#0d1018 60%,#080a10 100%);
  }
  /* window */
  .window{
    position:absolute;top:18%;left:12%;width:24%;height:34%;
    background:linear-gradient(180deg,#2a3550,#1a2540);
    border:3px solid #2a2a35;
    box-shadow:inset 0 0 0 2px rgba(57,255,122,0.15);
  }
  .window::before,.window::after{content:"";position:absolute;background:#2a2a35}
  .window::before{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}
  .window::after{top:50%;left:0;right:0;height:3px;transform:translateY(-50%)}
  /* desk */
  .desk{
    position:absolute;bottom:18%;left:50%;transform:translateX(-50%);
    width:50%;height:10%;background:#3a2a1a;border-top:3px solid #4a3a28;
  }
  /* pixel character (sitting) */
  .char{
    position:absolute;bottom:28%;left:50%;transform:translateX(-50%);
    width:64px;height:80px;
  }
  .char .head{
    width:24px;height:24px;background:#f0c8a0;margin:0 auto;
    box-shadow:0 0 0 2px #1a1a1a;
    position:relative;
  }
  .char .head::before,.char .head::after{
    content:"";position:absolute;top:10px;width:3px;height:3px;background:#1a1a1a;
  }
  .char .head::before{left:6px}
  .char .head::after{right:6px}
  .char .body{
    width:36px;height:30px;background:var(--green-dim);margin:2px auto 0;
    box-shadow:0 0 0 2px #1a1a1a;
  }
  .char .legs{
    width:36px;height:14px;margin:0 auto;display:flex;gap:4px;
  }
  .char .legs div{flex:1;background:#2a2a35}
  /* phone glow */
  .phone{
    position:absolute;bottom:30%;left:52%;width:8px;height:14px;
    background:var(--amber);box-shadow:0 0 12px var(--amber);
    animation:phonePulse 2s ease-in-out infinite;
  }
  @keyframes phonePulse{50%{opacity:.5;box-shadow:0 0 6px var(--amber)}}

  /* ===== Buttons ===== */
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btn{
    appearance:none;border:1px solid var(--border);background:var(--panel);
    color:var(--text);font-family:var(--vt);font-size:20px;cursor:pointer;
    padding:10px 22px;transition:all .15s;position:relative;
  }
  .btn:hover{border-color:var(--green);color:var(--green);box-shadow:0 0 12px rgba(57,255,122,0.2)}
  .btn.primary{border-color:var(--green);color:var(--green)}
  .btn.primary:hover{background:rgba(57,255,122,0.1)}
  .btn:disabled{opacity:.3;cursor:not-allowed}

  /* ===== Form ===== */
  .form{display:flex;flex-direction:column;gap:18px;max-width:480px;margin:12px 0}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-family:var(--px);font-size:9px;color:var(--dim);letter-spacing:1px}
  .field input,.field select{
    background:var(--bg2);border:1px solid var(--border);color:var(--green);
    font-family:var(--vt);font-size:22px;padding:8px 12px;outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--green)}
  .field .hint{font-size:15px;color:var(--dim)}

  /* ===== Question ===== */
  .q-num{font-family:var(--px);font-size:10px;color:var(--green);letter-spacing:2px;margin-bottom:10px}
  .q-title{font-size:24px;margin-bottom:6px;color:var(--text)}
  .q-ctx{font-size:17px;color:var(--dim);margin-bottom:18px;line-height:1.5}
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{
    border:1px solid var(--border);background:var(--panel);cursor:pointer;
    padding:14px 18px;transition:all .15s;display:flex;gap:14px;align-items:flex-start;
  }
  .opt:hover{border-color:var(--green);background:rgba(57,255,122,0.05)}
  .opt .tag{font-family:var(--px);font-size:10px;color:var(--green);min-width:18px}
  .opt .txt{font-size:19px;color:var(--text)}
  .opt .txt small{display:block;color:var(--dim);font-size:14px;margin-top:3px}

  /* ===== Result / ticker ===== */
  .delta-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);
    margin:18px 0;border:1px solid var(--border);
  }
  .delta{background:var(--panel);padding:12px;font-family:var(--px);font-size:9px}
  .delta .dk{color:var(--dim);letter-spacing:1px}
  .delta .dv{font-size:14px;margin-top:4px}
  .delta.up .dv{color:var(--green)}
  .delta.down .dv{color:var(--red)}
  .delta.flat .dv{color:var(--dim)}
  .delta .dv::before{content:""}

  .ticker{
    border:1px solid var(--border);background:#000;padding:8px 12px;
    font-family:var(--px);font-size:9px;color:var(--green);overflow:hidden;
    white-space:nowrap;margin:14px 0;letter-spacing:2px;
  }
  .ticker .track{display:inline-block;animation:tickerSlide 18s linear infinite}
  @keyframes tickerSlide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* chart */
  .chart-wrap{margin:18px 0;border:1px solid var(--border);background:var(--panel);padding:14px}
  .chart-wrap .ct{font-family:var(--px);font-size:9px;color:var(--dim);margin-bottom:10px;letter-spacing:1px}
  canvas{display:block;width:100%;height:120px;image-rendering:pixelated}

  /* ===== Ending ===== */
  .ending{display:flex;flex-direction:column;gap:14px}
  .ending h2{font-family:var(--px);font-size:16px;letter-spacing:2px}
  .ending h2.win{color:var(--green)}
  .ending h2.lose{color:var(--red)}
  .footprint{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border)}
  .fp{background:var(--panel);padding:14px}
  .fp .k{font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:1px}
  .fp .v{font-size:22px;margin-top:6px}
  .grade{font-family:var(--px);font-size:28px}

  .next-goal{font-size:17px;color:var(--amber);border-left:2px solid var(--amber);padding:6px 14px;margin-top:8px}

  /* ===== Music toggle ===== */
  .music-btn{
    position:absolute;top:10px;right:16px;z-index:60;
    background:none;border:1px solid var(--border);color:var(--dim);
    font-family:var(--px);font-size:8px;padding:4px 8px;cursor:pointer;letter-spacing:1px;
  }
  .music-btn.on{color:var(--green);border-color:var(--green)}

  /* scrollbar */
  .scene::-webkit-scrollbar{width:6px}
  .scene::-webkit-scrollbar-thumb{background:var(--border)}
  .scene::-webkit-scrollbar-track{background:transparent}

  @media(max-width:680px){
    #app{height:100vh;width:100vw}
    .hud{grid-template-columns:repeat(3,1fr)}
    .stat .v{font-size:11px}
    .typewriter{font-size:18px}
    .q-title{font-size:20px}
    .delta-grid{grid-template-columns:repeat(2,1fr)}
    .footprint{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="title" id="topTitle">MY SHOP // 经营模拟</div>
    <div id="topRound">ROUND 0/10</div>
  </div>

  <!-- HUD -->
  <div class="hud" id="hud" style="display:none">
    <div class="stat" id="s-cash"><div class="k">CASH</div><div class="v">¥200,000</div><div class="bar"><i style="width:80%"></i></div></div>
    <div class="stat" id="s-demand"><div class="k">DEMAND</div><div class="v">50</div><div class="bar"><i style="width:50%"></i></div></div>
    <div class="stat" id="s-price"><div class="k">PRICE</div><div class="v">50</div><div class="bar"><i style="width:50%"></i></div></div>
    <div class="stat" id="s-rep"><div class="k">REPUTATION</div><div class="v">50</div><div class="bar"><i style="width:50%"></i></div></div>
    <div class="stat" id="s-welfare"><div class="k">WELFARE</div><div class="v">50</div><div class="bar"><i style="width:50%"></i></div></div>
    <div class="stat" id="s-sustain"><div class="k">SUSTAIN</div><div class="v">50</div><div class="bar"><i style="width:50%"></i></div></div>
  </div>

  <button class="music-btn" id="musicBtn">♪ OFF</button>

  <div class="stage" id="stage">

    <!-- Scene 0: Title -->
    <div class="scene active" id="sc-title">
      <div class="pixel-room">
        <div class="room-bg"></div>
        <div class="window"></div>
        <div class="desk"></div>
        <div class="char">
          <div class="head"></div>
          <div class="body"></div>
          <div class="legs"><div></div><div></div></div>
        </div>
        <div class="phone"></div>
      </div>
      <div style="text-align:center">
        <h1 style="font-family:var(--px);font-size:22px;color:var(--green);letter-spacing:3px;margin-bottom:8px">MY SHOP</h1>
        <p style="color:var(--dim);font-size:18px;margin-bottom:20px">一个关于开店、选择与代价的模拟</p>
        <div class="actions" style="justify-content:center">
          <button class="btn primary" id="startBtn">开始故事 ▸</button>
        </div>
      </div>
    </div>

    <!-- Scene 1: Story 1.1 -->
    <div class="scene" id="sc-story">
      <div class="pixel-room">
        <div class="room-bg"></div>
        <div class="window"></div>
        <div class="desk"></div>
        <div class="char">
          <div class="head"></div>
          <div class="body"></div>
          <div class="legs"><div></div><div></div></div>
        </div>
        <div class="phone"></div>
      </div>
      <div class="typewriter" id="tw-story"></div>
      <div class="actions" id="story-actions" style="display:none">
        <button class="btn primary" id="toForm">继续 ▸</button>
      </div>
    </div>

    <!-- Scene 2: Identity -->
    <div class="scene" id="sc-form">
      <div class="q-num">CHAPTER 1.2 // 你的身份</div>
      <div class="q-title">在开始之前，告诉我你是谁。</div>
      <div class="form">
        <div class="field">
          <label>姓名 / NAME</label>
          <input type="text" id="inp-name" placeholder="输入你的名字…" maxlength="12">
        </div>
        <div class="field">
          <label>年龄 / AGE</label>
          <select id="inp-age">
            <option>22</option><option>25</option><option selected>28</option>
            <option>31</option><option>34</option><option>37</option>
          </select>
        </div>
        <div class="field">
          <label>初始资金 / CAPITAL</label>
          <select id="inp-cap">
            <option value="120000">¥120,000（困难）</option>
            <option value="200000" selected>¥200,000（普通）</option>
            <option value="350000">¥350,000（轻松）</option>
          </select>
          <span class="hint">前打工人，现准店主。存款即全部家当。</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="formNext">开店去 ▸</button>
      </div>
    </div>

    <!-- Scene 3: Question -->
    <div class="scene" id="sc-q">
      <div class="q-num" id="q-num">QUESTION 1</div>
      <div class="q-title" id="q-title"></div>
      <div class="q-ctx" id="q-ctx"></div>
      <div class="options" id="q-opts"></div>
    </div>

    <!-- Scene 4: Result -->
    <div class="scene" id="sc-result">
      <div class="q-num" id="r-tag">RESULT</div>
      <div class="q-title" id="r-title"></div>
      <div class="q-ctx" id="r-desc"></div>
      <div class="ticker"><div class="track" id="r-ticker"></div></div>
      <div class="delta-grid" id="r-deltas"></div>
      <div class="chart-wrap">
        <div class="ct">CASH FLOW // 资金流走势</div>
        <canvas id="chart"></canvas>
      </div>
      <div class="actions">
        <button class="btn primary" id="nextQ">下一回合 ▸</button>
      </div>
    </div>

    <!-- Scene 5: Ending -->
    <div class="scene" id="sc-end">
      <div class="ending" id="endBox"></div>
      <div class="actions">
        <button class="btn primary" id="restart">再来一次 ▸</button>
      </div>
    </div>

  </div>
</div>

<script>
/* =========================================================
   MY SHOP — 经营模拟
   指标: cash / demand / price / reputation / welfare / sustain
   ========================================================= */

// ---------- Audio (8-bit bgm) ----------
const Audio8 = (()=>{
  let ctx, master, playing=false, timer;
  function init(){
    if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.08;
    master.connect(ctx.destination);
  }
  // 简单 8-bit 旋律 (A minor 风格, 温馨循环)
  const melody = [
    [440,0.4],[523,0.4],[659,0.4],[523,0.2],[587,0.2],
    [659,0.4],[523,0.4],[440,0.4],[392,0.4],
    [440,0.2],[523,0.2],[659,0.4],[784,0.4],
    [659,0.4],[523,0.4],[440,0.8],[0,0.4],
  ];
  let idx=0;
  function note(freq,dur){
    if(!freq){ setTimeout(()=>note(melody[idx][0],melody[idx][1]),dur*1000); return; }
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type='square'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.5,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ctx.currentTime+dur);
  }
  function step(){
    if(!playing) return;
    const [f,d] = melody[idx];
    note(f,d);
    idx = (idx+1) % melody.length;
    timer = setTimeout(step, d*1000);
  }
  return {
    toggle(){
      init();
      if(playing){ playing=false; clearTimeout(timer); return false; }
      playing=true; if(ctx.state==='suspended') ctx.resume(); step();
      return true;
    },
    blip(up=true){
      init();
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='square';
      o.frequency.setValueAtTime(up?440:220,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(up?880:110,ctx.currentTime+0.1);
      g.gain.setValueAtTime(0.2,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.15);
      o.connect(g); g.connect(master);
      o.start(); o.stop(ctx.currentTime+0.15);
    }
  };
})();

document.getElementById('musicBtn').addEventListener('click', e=>{
  const on = Audio8.toggle();
  e.target.textContent = on ? '♪ ON' : '♪ OFF';
  e.target.classList.toggle('on', on);
});

// ---------- Typewriter ----------
function typewrite(el, text, speed=38){
  return new Promise(res=>{
    el.innerHTML = '';
    let i=0;
    const cur = document.createElement('span'); cur.className='cursor';
    el.appendChild(cur);
    const t = setInterval(()=>{
      if(i>=text.length){ clearInterval(t); setTimeout(res,400); return; }
      const ch = text[i++];
      const node = document.createTextNode(ch);
      el.insertBefore(node, cur);
      if(i%3===0) Audio8.blip(true);
    }, speed);
  });
}

// ---------- Game state ----------
const state = {
  name:'店主', age:28, cap:200000,
  cash:200000, demand:50, price:50, reputation:50, welfare:50, sustain:50,
  round:0, history:[], round2:false, goal2:null,
};

// ---------- Questions ----------
// 每个选项: 影响 cash / demand / price / reputation / welfare / sustain
// 连续市场: 后面题目的 ctx 会引用前面选择
const QUESTIONS = [
  {
    title:"第一笔投入，选址",
    ctx:(s)=>`你拿着 ¥${fmt(s.cash)} 的全部家当，站在三条街的路口。店面一旦定下，就很难再搬。`,
    opts:[
      {tag:"A",txt:"商业街黄金铺位",sub:"月租¥18,000，但人流密集",
        e:{cash:-36000,demand:18,price:6,reputation:4,welfare:0,sustain:-6}},
      {tag:"B",txt:"社区安静角落",sub:"月租¥6,000，客流稳定但小",
        e:{cash:-12000,demand:6,price:-2,reputation:6,welfare:4,sustain:8}},
      {tag:"C",txt:"大学校园旁",sub:"月租¥9,000，学生客流季节性波动",
        e:{cash:-18000,demand:12,price:-4,reputation:2,welfare:0,sustain:2}},
    ]
  },
  {
    title:"定价策略",
    ctx:(s)=>`店面租下了。现在要给商品定价——价格定高，单笔赚得多但客人少；定低，走量但薄利。你当前需求度 ${s.demand}。`,
    opts:[
      {tag:"A",txt:"高价精品路线",sub:"客单价高，塑造品质感",
        e:{cash:8000,demand:-14,price:22,reputation:10,welfare:0,sustain:-2}},
      {tag:"B",txt:"平价走量",sub:"便宜但人多",
        e:{cash:12000,demand:16,price:-14,reputation:-2,welfare:2,sustain:4}},
      {tag:"C",txt:"跟随市场均价",sub:"不出错也不出彩",
        e:{cash:6000,demand:4,price:2,reputation:2,welfare:0,sustain:0}},
    ]
  },

// ---------- Helpers ----------
function fmt(n){ return Math.round(n).toLocaleString('zh-CN'); }
function clamp(n,a=0,b=100){ return Math.max(a,Math.min(b,n)); }

const KEYS = [
  ['cash','CASH'], ['demand','DEMAND'], ['price','PRICE'],
  ['reputation','REPUT'], ['welfare','WELFARE'], ['sustain','SUSTAIN']
];

function updateHUD(){
  const map = {
    's-cash': state.cash,
    's-demand': state.demand,
    's-price': state.price,
    's-rep': state.reputation,
    's-welfare': state.welfare,
    's-sustain': state.sustain,
  };
  for(const [id,val] of Object.entries(map)){
    const el = document.getElementById(id);
    const v = el.querySelector('.v');
    const bar = el.querySelector('.bar i');
    if(id==='s-cash'){
      v.textContent = '¥'+fmt(val);
      const pct = clamp(val/state.cap*100/2, 0, 100);
      bar.style.width = pct+'%';
      el.className = 'stat ' + (val<=0?'bad':val<state.cap*0.3?'warn':'good');
    } else {
      v.textContent = Math.round(val);
      bar.style.width = val+'%';
      el.className = 'stat ' + (val>=60?'good':val<=30?'bad':'warn');
    }
  }
  document.getElementById('topRound').textContent = `ROUND ${state.round}/10`;
}

// ---------- Scene control ----------
function show(id){
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ---------- Story 1.1 ----------

// ---------- Identity form ----------
document.getElementById('formNext').addEventListener('click', ()=>{
  const name = document.getElementById('inp-name').value.trim() || '店主';
  const age = +document.getElementById('inp-age').value;
  const cap = +document.getElementById('inp-cap').value;

  Audio8.blip(true);
  document.getElementById('hud').style.display='grid';
  document.getElementById('topTitle').textContent = `MY SHOP // ${name}`;

// ---------- Question flow ----------
function nextQuestion(){
  if(state.round >= QUESTIONS.length){ return ending(); }
  // 破产检测
  if(state.cash <= 0){ return ending(true); }

  const q = QUESTIONS[state.round];
  document.getElementById('q-num').textContent =
    `QUESTION ${state.round+1} / ${QUESTIONS.length}` + (state.round2?`  // 二周目·目标:${state.goal2}`:'');
  document.getElementById('q-title').textContent = q.title;
  document.getElementById('q-ctx').textContent = q.ctx(state);

  const opts = document.getElementById('q-opts');
  opts.innerHTML = '';
  q.opts.forEach(o=>{
    const div = document.createElement('div');
    div.className='opt';
    div.innerHTML = `<div class="tag">${o.tag}</div><div class="txt">${o.txt}<small>${o.sub}</small></div>`;
    div.addEventListener('click', ()=>choose(o));
    opts.appendChild(div);
  });
  show('sc-q');
}

function choose(o){
  Audio8.blip(true);
  // 应用影响 (连续市场)
  state.cash += o.e.cash;
  state.demand = clamp(state.demand + o.e.demand);
  state.price = clamp(state.price + o.e.price);
  state.reputation = clamp(state.reputation + o.e.reputation);
  state.welfare = clamp(state.welfare + o.e.welfare);
  state.sustain = clamp(state.sustain + o.e.sustain);

  // 月度模拟: 收入 = demand * price * 系数; 支出 = 固定
  const income = (state.demand * state.price * 0.6);
  const expense = 8000 + (state.welfare<30?2000:0);
  state.cash += (income - expense);
  state.history.push(state.cash);

  state.round++;
  updateHUD();
  showResult(o);
}

function showResult(o){
  document.getElementById('r-tag').textContent = `RESULT // ROUND ${state.round}`;
  document.getElementById('r-title').textContent = o.txt;
  document.getElementById('r-desc').textContent = o.sub;

  // ticker
  const items = ['CNY '+fmt(state.cash),'DEMAND '+Math.round(state.demand),
    'PRICE '+Math.round(state.price),'REP '+Math.round(state.reputation),
    'WELFARE '+Math.round(state.welfare),'SUSTAIN '+Math.round(state.sustain),
    'CASHFLOW '+(state.cash>=0?'+':'')+fmt(state.cash),'// MY SHOP // '+state.name+' //'];
  const t = items.join('  ●  ')+'  ●  ';
  document.getElementById('r-ticker').textContent = t+t;

  // deltas
  const grid = document.getElementById('r-deltas');
  grid.innerHTML='';
  for(const [k,label] of KEYS){
    const dv = o.e[k];
    const cls = dv>0?'up':dv<0?'down':'flat';
    const sign = dv>0?'+':'';
    const cur = k==='cash'? '¥'+fmt(state.cash) : Math.round(state[k]);
    const div = document.createElement('div');
    div.className='delta '+cls;
    div.innerHTML = `<div class="dk">${label}</div><div class="dv">${sign}${k==='cash'?'¥'+fmt(dv):dv}  →  ${cur}</div>`;
    grid.appendChild(div);
  }

  // chart
  drawChart();

  // 下一步按钮文字
  const nb = document.getElementById('nextQ');
  if(state.round >= QUESTIONS.length || state.cash<=0){
    nb.textContent = '查看结局 ▸';
  } else {
    nb.textContent = '下一回合 ▸';
  }
  show('sc-result');
}

document.getElementById('nextQ').addEventListener('click', ()=>{
  Audio8.blip(true);
  if(state.round >= QUESTIONS.length || state.cash<=0){
    ending(state.cash<=0);
  } else {
    nextQuestion();
  }
});

// ---------- Chart ----------
function drawChart(){
  const c = document.getElementById('chart');
  const dpr = window.devicePixelRatio||1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w*dpr; c.height = h*dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const data = state.history;
  if(data.length<2) return;
  const min = Math.min(...data, 0);
  const max = Math.max(...data, state.cap);
  const range = max-min || 1;

  // grid
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y = (h/4)*i;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }
  // zero line
  if(min<0){
    const zy = h - ((0-min)/range)*h;
    ctx.strokeStyle='rgba(255,59,92,0.4)'; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(0,zy); ctx.lineTo(w,zy); ctx.stroke();
    ctx.setLineDash([]);
  }

  // line
  ctx.strokeStyle = state.cash>=0 ? '#39ff7a' : '#ff3b5c';
  ctx.lineWidth=2;
  ctx.beginPath();
  data.forEach((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - ((v-min)/range)*h;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // fill
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle = state.cash>=0 ? 'rgba(57,255,122,0.08)' : 'rgba(255,59,92,0.08)';
  ctx.fill();

  // last point
  const lx = w, ly = h - ((data[data.length-1]-min)/range)*h;
  ctx.fillStyle = state.cash>=0?'#39ff7a':'#ff3b5c';
  ctx.fillRect(lx-3,ly-3,6,6);
}

// ---------- Ending ----------
function ending(bankrupt=false){
  // 综合评分
  const profit = state.cash - state.cap;
  const avgWelfare = state.welfare;
  const score = Math.round(
    state.cash*0.3 + state.reputation*200 + state.welfare*200 + state.sustain*200 + (profit>0?profit*0.2:0)
  );

  let grade='D', title='', cls='lose', desc='';
  if(bankrupt){
    title='GAME OVER // 破产'; cls='lose';
    desc=`${state.name}，你的店在第 ${state.round} 回合倒闭了。现金归零，账上只剩叹息。经营不是只看利润，但没有了现金流，一切归零。`;
    grade='F';
  } else if(state.cash >= state.cap*2 && state.reputation>=70 && state.sustain>=60){
    title='通关 // 你的店活下来了'; cls='win';
    grade='S';
    desc=`${state.name}，十回合过去了。你的店不仅活着，还活成了街区的一部分。钱赚到了，人也善待了，店也站住了。`;
  } else if(state.cash >= state.cap*1.3){
    title='通关 // 小有所成'; cls='win';
    grade='B';
    desc=`${state.name}，你撑过了十个回合，账上还有余粮。算不上大富大贵，但这是你自己挣来的。`;
  } else {
    title='勉强通关 // 苦撑到底'; cls='lose';
    grade='C';
    desc=`${state.name}，你撑到了最后，但代价不小。账面紧绷，声誉或福利有缺口。经营，永远是在取舍。`;
  }

  // Economic Footprint
  const fp = [
    ['最终现金','¥'+fmt(state.cash), state.cash>=state.cap?'good':'bad'],
    ['净利润',(profit>=0?'+':'')+'¥'+fmt(profit), profit>=0?'good':'bad'],
    ['声誉指数',Math.round(state.reputation)+'/100', state.reputation>=60?'good':'bad'],
    ['员工福利',Math.round(state.welfare)+'/100', state.welfare>=60?'good':'bad'],
    ['可持续性',Math.round(state.sustain)+'/100', state.sustain>=60?'good':'bad'],
    ['综合评级',grade, grade==='S'||grade==='A'?'good':grade==='F'?'bad':'warn'],
  ];

  // 二周目目标
  let goal2 = '';
  if(!state.round2){
    // 找最弱的维度作为新目标
    const dims = [['reputation','声誉'],['welfare','员工福利'],['sustain','可持续性']];
    dims.sort((a,b)=>state[a[0]]-state[b[0]]);
    goal2 = `二周目挑战：在不破产的前提下，把「${dims[0][1]}」提升到 80 以上。`;
  }

  const box = document.getElementById('endBox');
  box.innerHTML = `
    <h2 class="${cls}">${title}</h2>
    <p style="color:var(--dim);font-size:17px">${desc}</p>
    <div class="footprint">
      ${fp.map(f=>`<div class="fp"><div class="k">${f[0]}</div><div class="v ${f[2]==='good'?'':''}" style="color:${f[2]==='good'?'var(--green)':f[2]==='bad'?'var(--red)':'var(--amber)'}">${f[1]}</div></div>`).join('')}
    </div>
    ${goal2?`<div class="next-goal">▸ ${goal2}</div>`:'<div class="next-goal" style="color:var(--green);border-color:var(--green)">二周目已完成。感谢游玩。</div>'}
    <p style="color:var(--dim);font-size:15px;margin-top:4px">没有标准答案。每个选择都有代价。下次，换个活法。</p>
  `;

  document.getElementById('restart').textContent = state.round2 ? '从头再来 ▸' : '二周目挑战 ▸';
  show('sc-end');
}

document.getElementById('restart').addEventListener('click', ()=>{
  Audio8.blip(true);
  if(!state.round2){
    // 进入二周目
    state.round2 = true;
    state.cash = state.cap;
    state.demand=50; state.price=50; state.reputation=50; state.welfare=50; state.sustain=50;
    state.round=0; state.history=[state.cap];
    updateHUD();
    nextQuestion();
  } else {
    // 完全重置
    state.round2=false; state.goal2=null;
    document.getElementById('hud').style.display='none';
    show('sc-title');
  }
});
