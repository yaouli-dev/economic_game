<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小宇宙 · iPad</title>
<style>
  :root{
    --bg:#0b0d14;
    --bg2:#11141f;
    --text:#e8eaf2;
    --muted:#9aa0b4;
    --accent:#ffb066;       /* 暖光（追剧） */
    --accent-cool:#8aa9ff;  /* 冷光（播客） */
    --pink:#f687b3;
    --border:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1000px 500px at 80% -10%, rgba(255,176,102,0.10), transparent 60%),
      radial-gradient(900px 500px at 0% 20%, rgba(138,169,255,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:40px 20px 60px;overflow-x:hidden;
  }

  /* Header */
  header{text-align:center;margin-bottom:28px}
  header h1{
    font-size:30px;font-weight:700;letter-spacing:2px;
    background:linear-gradient(90deg,var(--accent),var(--pink),var(--accent-cool));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--muted);font-size:14px;margin-top:6px}

  /* Mode buttons */
  .modes{display:flex;gap:12px;margin-bottom:36px;flex-wrap:wrap;justify-content:center}
  .mode-btn{
    appearance:none;border:1px solid var(--border);
    background:rgba(255,255,255,0.03);color:var(--text);
    padding:11px 22px;border-radius:999px;font-size:15px;cursor:pointer;
    transition:all .25s ease;display:inline-flex;align-items:center;gap:8px;
    font-family:inherit;
  }
  .mode-btn:hover{background:rgba(255,255,255,0.07);transform:translateY(-2px)}
  .mode-btn.active{
    background:linear-gradient(135deg,rgba(255,176,102,0.25),rgba(246,135,179,0.2));
    border-color:rgba(255,176,102,0.4);
    box-shadow:0 6px 20px rgba(255,176,102,0.15);
  }
  .mode-btn .ic{font-size:17px}

  /* Stage */
  .stage{
    position:relative;width:100%;max-width:760px;min-height:520px;
    display:flex;align-items:center;justify-content:center;
  }

  /* ===== iPad ===== */
  .ipad-wrap{position:relative;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
  .ipad-wrap.hide{opacity:0;pointer-events:none;position:absolute}

  .ipad{
    width:300px;height:420px;border-radius:34px;
    background:linear-gradient(150deg,#3a3a40,#1c1c22 60%,#2a2a30);
    padding:16px;position:relative;
    box-shadow:0 30px 70px rgba(0,0,0,0.6),inset 0 1px 1px rgba(255,255,255,0.08);
    transition:box-shadow .6s ease;
  }
  .ipad .cam{position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:6px;height:6px;border-radius:50%;background:#0a0a0c;box-shadow:inset 0 0 2px rgba(255,255,255,0.2)}
  .screen{
    width:100%;height:100%;border-radius:20px;overflow:hidden;position:relative;
    background:#05060a;transition:all .7s ease;
  }

  /* off state */
  .screen .glint{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,0.04) 50%,transparent 60%);
  }
  .screen-home{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#3a3f4d;gap:10px;transition:opacity .4s;
  }
  .screen-home .sym{font-size:34px}
  .screen-home p{font-size:13px}

  /* on states */
  .ipad.on .screen{background:#10131c}
  .ipad.on.drama{
    box-shadow:0 0 0 1px rgba(255,176,102,0.25),0 0 120px rgba(255,176,102,0.30),0 30px 70px rgba(0,0,0,0.6);
  }
  .ipad.on.drama .screen{box-shadow:inset 0 0 90px rgba(255,176,102,0.22)}
  .ipad.on.podcast{
    box-shadow:0 0 0 1px rgba(138,169,255,0.25),0 0 120px rgba(138,169,255,0.30),0 30px 70px rgba(0,0,0,0.6);
  }
  .ipad.on.podcast .screen{box-shadow:inset 0 0 90px rgba(138,169,255,0.22)}

  .screen-list{
    position:absolute;inset:0;opacity:0;transition:opacity .45s ease .15s;
    overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;
  }
  .screen-list::-webkit-scrollbar{width:4px}
  .screen-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
  .ipad.on .screen-list{opacity:1}

  .list-head{font-size:13px;color:var(--muted);padding:2px 4px 4px;letter-spacing:1px}
  .item{
    display:flex;gap:11px;align-items:center;
    background:rgba(255,255,255,0.04);border:1px solid var(--border);
    border-radius:12px;padding:8px;transition:background .2s,transform .2s;cursor:pointer;
  }
  .item:hover{background:rgba(255,255,255,0.08);transform:translateX(2px)}
  .item img{width:54px;height:54px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#222}
  .item .meta{min-width:0}
  .item .meta h4{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta p{font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}

  /* Headphones */
  .headphones{
    position:absolute;top:-46px;left:50%;transform:translateX(-50%) scale(.6);
    width:230px;height:auto;opacity:0;transition:opacity .5s ease,transform .5s ease;pointer-events:none;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,0.5));
  }
  .ipad-wrap.show-phones .headphones{opacity:1;transform:translateX(-50%) scale(1)}

  /* ===== Bookshelf ===== */
  .shelf-wrap{opacity:0;pointer-events:none;position:absolute;transition:opacity .4s}
  .shelf-wrap.show{opacity:1;pointer-events:auto;position:relative}

  .shelf{position:relative;width:100%;max-width:680px}
  .shelf-row{display:flex;align-items:flex-end;gap:6px;padding:0 10px;height:200px}
  .book{
    flex:0 0 auto;cursor:pointer;position:relative;border-radius:3px 3px 0 0;
    box-shadow:inset -6px 0 10px rgba(0,0,0,0.35),inset 6px 0 6px rgba(255,255,255,0.06),2px 2px 8px rgba(0,0,0,0.4);
    transition:transform .25s ease,filter .25s ease;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .book:hover{transform:translateY(-10px);filter:brightness(1.15)}
  .book span{
    writing-mode:vertical-rl;text-orientation:upright;font-size:13px;font-weight:600;
    color:rgba(255,255,255,0.92);letter-spacing:2px;padding:14px 4px;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  .book::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:rgba(255,255,255,0.18)}
  .book::before{content:"";position:absolute;left:0;right:0;bottom:14px;height:2px;background:rgba(255,255,255,0.25)}
  .board{
    height:14px;background:linear-gradient(#5a3a22,#3e2814);border-radius:2px;
    box-shadow:0 8px 16px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .shelf-hint{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}

  /* ===== Novel detail ===== */
  .detail{
    position:fixed;inset:0;background:rgba(5,7,12,0.78);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .detail.show{opacity:1;pointer-events:auto}
  .detail-card{
    background:var(--bg2);border:1px solid var(--border);border-radius:20px;
    max-width:560px;width:100%;display:flex;gap:20px;padding:22px;position:relative;
    transform:translateY(16px) scale(.98);transition:transform .35s;
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
  }
  .detail.show .detail-card{transform:none}
  .detail-card img{width:150px;height:210px;border-radius:10px;object-fit:cover;flex-shrink:0;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  .detail-card .info h3{font-size:22px;margin-bottom:4px}
  .detail-card .info .author{color:var(--pink);font-size:13px;margin-bottom:12px}
  .detail-card .info .desc{color:#cdd0dc;font-size:14px;line-height:1.75}
  .detail-card .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .detail-card .tags span{font-size:12px;color:var(--muted);background:rgba(255,255,255,0.05);padding:4px 10px;border-radius:999px;border:1px solid var(--border)}
  .close{
    position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);
    font-size:24px;cursor:pointer;line-height:1;
  }
  .close:hover{color:#fff}

  .home-btn{
    margin-top:30px;appearance:none;border:1px solid var(--border);background:rgba(255,255,255,0.03);
    color:var(--muted);padding:9px 20px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px;
    transition:all .2s;opacity:0;pointer-events:none;
  }
  .home-btn.show{opacity:1;pointer-events:auto}
  .home-btn:hover{color:#fff;background:rgba(255,255,255,0.07)}

  @media(max-width:520px){
    .ipad{width:260px;height:364px}
    .detail-card{flex-direction:column;text-align:center}
    .detail-card img{width:120px;height:168px;margin:0 auto}
  }
</style>
</head>
<body>

  <header>
    <h1>我的小宇宙</h1>
    <p>选一个入口，开始探索 ✦</p>
  </header>

  <div class="modes">
    <button class="mode-btn" data-mode="drama"><span class="ic">🎬</span>追剧</button>
    <button class="mode-btn" data-mode="podcast"><span class="ic">🎧</span>播客</button>
    <button class="mode-btn" data-mode="shelf"><span class="ic">📚</span>书架</button>
  </div>

  <div class="stage">
    <!-- iPad -->
    <div class="ipad-wrap" id="ipadWrap">
      <!-- Headphones SVG -->
      <svg class="headphones" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4a4a52"/>
            <stop offset="1" stop-color="#2a2a30"/>
          </linearGradient>
          <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3a3a42"/>
            <stop offset="1" stop-color="#1c1c22"/>
          </linearGradient>
        </defs>
        <path d="M 30 120 Q 120 10 210 120" stroke="url(#band)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <rect x="14" y="108" width="40" height="64" rx="16" fill="url(#cup)" stroke="rgba(255,255,255,0.08)"/>
        <rect x="186" y="108" width="40" height="64" rx="16" fill="url(#cup)" stroke="rgba(255,255,255,0.08)"/>
        <rect x="22" y="120" width="24" height="40" rx="10" fill="#0e0e12"/>
        <rect x="194" y="120" width="24" height="40" rx="10" fill="#0e0e12"/>
      </svg>

      <div class="ipad" id="ipad">
        <div class="cam"></div>
        <div class="screen" id="screen">
          <div class="glint"></div>
          <div class="screen-home" id="screenHome">
            <div class="sym">✦</div>
            <p>等待开启…</p>
          </div>
          <div class="screen-list" id="screenList"></div>
        </div>
      </div>
    </div>

    <!-- Bookshelf -->
    <div class="shelf-wrap" id="shelfWrap">
      <div class="shelf">
        <div class="shelf-row" id="shelfRow"></div>
        <div class="board"></div>
        <div class="shelf-hint">点一本想翻开的书 👆</div>
      </div>
    </div>
  </div>

  <button class="home-btn" id="homeBtn">← 回到首页</button>

  <!-- Novel detail -->
  <div class="detail" id="detail">
    <div class="detail-card">
      <button class="close" id="closeDetail">×</button>
      <img id="dImg" src="" alt="">
      <div class="info">
        <h3 id="dTitle"></h3>
        <div class="author" id="dAuthor"></div>
        <div class="desc" id="dDesc"></div>
        <div class="tags" id="dTags"></div>
      </div>
    </div>
  </div>

<script>
const IMG = (prompt,size="square") =>
  `https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=${encodeURIComponent(prompt)}&image_size=${size}`;

const dramas = [
  {title:"隐秘的角落", desc:"三个小孩在景区无意拍下一场谋杀，从此被卷入深渊。", prompt:"dark suspense drama poster, three small children silhouettes on a cliff overlooking a coastal town, ominous moody sky, cinematic teal and orange lighting, mystery atmosphere"},
  {title:"漫长的季节", desc:"东北小城，跨越近二十年的追凶，秋日从未结束。", prompt:"melancholic autumn small town Northeast China, old factory smokestacks, golden cornfield under grey sky, nostalgic crime drama mood, cinematic poster"},
  {title:"沉默的真相", desc:"一名检察官用十年青春与生命，守着一个不能说的真相。", prompt:"rainy night city street, lone figure with umbrella under streetlight, neon reflections on wet pavement, dark justice thriller mood, cinematic"},
  {title:"唐人街探案", desc:"曼谷唐人街，搞笑搭档卷入连环奇案，推理不停。", prompt:"vibrant Bangkok Chinatown night market street, colorful neon signs, comedic detective mystery atmosphere, cinematic warm lighting"},
];

const podcasts = [
  {title:"故事FM", desc:"用你的声音讲你的故事，每个普通人都是主角。", prompt:"warm intimate podcast scene, vintage condenser microphone on desk, soft warm lamplight, cozy storytelling mood, shallow depth of field"},
  {title:"忽左忽右", desc:"时事与文化的深度对谈，在左右之间寻找答案。", prompt:"two chairs facing each other in modern minimalist podcast studio, headphones on table, thoughtful conversation mood, soft light"},
  {title:"大内密谈", desc:"音乐与亚文化的密谈，深夜最合拍的耳朵伴侣。", prompt:"vinyl records and musical instruments on shelf, retro music podcast vibe, warm amber tones, moody lighting"},
  {title:"展开讲讲", desc:"年轻人关心的事，一杯咖啡的时间展开聊聊。", prompt:"casual coffee chat podcast scene, two coffee cups on wooden table, relaxed cozy atmosphere, soft natural light"},
];

const novels = [
  {title:"嫌疑人X的献身", author:"东野圭吾", color:"#3d5a80",
   desc:"天才数学家为掩护邻居母女，设下一个近乎完美的局。当爱与罪相遇，最冷静的逻辑也藏着最深的深情。",
   tags:["推理","献身","极致诡计"],
   prompt:"mystery novel book cover, lonely bridge at dawn, misty river, subtle mathematical grid pattern overlay, melancholic blue and grey tones, minimal text-free"},
  {title:"白夜行", author:"东野圭吾", color:"#1a1a2e",
   desc:"一桩命案串起两个孩子的一生，他们像太阳与影子，在白夜里彼此相依又永不并行。",
   tags:["社会派","宿命","黑暗"],
   prompt:"mystery novel book cover, two children silhouettes walking in opposite directions under pale sunless sky, cold blue atmosphere, minimal text-free"},
  {title:"坏小孩", author:"紫金陈", color:"#5a1a1a",
   desc:"三个小孩目睹了一场谋杀，却用天真写下了最危险的故事。大人的恶，孩子的冷，让人脊背发凉。",
   tags:["心理悬疑","少年","反转"],
   prompt:"suspense novel book cover, three children standing on rooftop edge looking down, dark ominous sky, moody, minimal text-free"},
  {title:"长夜难明", author:"紫金陈", color:"#2d3a1a",
   desc:"一个人为了迟到的正义，赌上前途、名誉乃至生命。长夜漫漫，总有人愿意燃尽自己点一盏灯。",
   tags:["现实主义","正义","沉重"],
   prompt:"thriller novel book cover, dark long empty street at night with single glowing streetlamp, fallen autumn leaves, somber mood, minimal text-free"},
  {title:"解忧杂货店", author:"东野圭吾", color:"#6b4a1a",
   desc:"一家能穿越时空收信的杂货店，写给迷茫者的回信，温柔地解开每个心结。悬疑外壳下，是治愈的内核。",
   tags:["治愈","奇幻","温情"],
   prompt:"warm nostalgic novel book cover, old Japanese grocery store at night with glowing warm window, magical gentle atmosphere, minimal text-free"},
];

const ipad = document.getElementById('ipad');
const ipadWrap = document.getElementById('ipadWrap');
const screenHome = document.getElementById('screenHome');
const screenList = document.getElementById('screenList');
const shelfWrap = document.getElementById('shelfWrap');
const shelfRow = document.getElementById('shelfRow');
const homeBtn = document.getElementById('homeBtn');
const modeBtns = document.querySelectorAll('.mode-btn');

function renderList(items, head){
  screenList.innerHTML = `<div class="list-head">${head}</div>` +
    items.map(it => `
      <div class="item">
        <img src="${IMG(it.prompt)}" alt="${it.title}" loading="lazy">
        <div class="meta"><h4>${it.title}</h4><p>${it.desc}</p></div>
      </div>`).join('');
}

function setMode(mode){
  modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  ipad.classList.remove('drama','podcast','on');
  ipadWrap.classList.remove('show-phones');
  shelfWrap.classList.remove('show');
  ipadWrap.classList.remove('hide');

  if(!mode){ // idle
    screenHome.style.opacity = 1;
    screenList.innerHTML = '';
    homeBtn.classList.remove('show');
    return;
  }
  screenHome.style.opacity = 0;
  homeBtn.classList.add('show');

  if(mode === 'drama'){
    ipad.classList.add('on','drama');
    renderList(dramas, '🎬 今夜追什么');
  } else if(mode === 'podcast'){
    ipad.classList.add('on','podcast');
    ipadWrap.classList.add('show-phones');
    renderList(podcasts, '🎧 戴上耳机听听');
  } else if(mode === 'shelf'){
    ipadWrap.classList.add('hide');
    shelfWrap.classList.add('show');
    renderShelf();
  }
}

function renderShelf(){
  // 给每本书随机高度和宽度，更真实
  shelfRow.innerHTML = novels.map(n => {
    const w = 38 + Math.round(Math.random()*10);
    const h = 150 + Math.round(Math.random()*40);
    return `<div class="book" data-title="${n.title}" style="background:linear-gradient(135deg,${n.color},${shade(n.color,-25)});width:${w}px;height:${h}px">
      <span>${n.title}</span>
    </div>`;
  }).join('');
  shelfRow.querySelectorAll('.book').forEach(b => {
    b.addEventListener('click', () => openDetail(b.dataset.title));
  });
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return `#${(r<<16|g<<8|b).toString(16).padStart(6,'0')}`;
}

const detail = document.getElementById('detail');
function openDetail(title){
  const n = novels.find(x => x.title === title);
  if(!n) return;
  document.getElementById('dImg').src = IMG(n.prompt, "portrait_4_3");
  document.getElementById('dTitle').textContent = n.title;
  document.getElementById('dAuthor').textContent = '作者：' + n.author;
  document.getElementById('dDesc').textContent = n.desc;
  document.getElementById('dTags').innerHTML = n.tags.map(t=>`<span>#${t}</span>`).join('');
  detail.classList.add('show');
}
document.getElementById('closeDetail').addEventListener('click', () => detail.classList.remove('show'));
detail.addEventListener('click', e => { if(e.target === detail) detail.classList.remove('show'); });

modeBtns.forEach(b => {
  b.addEventListener('click', () => {
    const m = b.dataset.mode;
    setMode(b.classList.contains('active') ? null : m);
  });
});
homeBtn.addEventListener('click', () => setMode(null));
</script>
</body>
</html>
