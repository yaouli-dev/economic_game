<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素小店 · 温馨模拟经营</title>
<style>
:root{
  --bg:#fff6ea; --panel:#fffdf8; --panel2:#fdf2e0; --line:#e8d6ba;
  --txt:#5a4632; --dim:#a08a6e; --warm:#e8934a; --warm2:#d97a3d;
  --pink:#e88aa0; --green:#6fae5e; --red:#d96a5a; --amber:#d9a441;
  --wood:#c89a6a; --woodD:#a87a4e;
  --sans:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
  --pix:'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
button{font-family:var(--sans);cursor:pointer;user-select:none}
input,select{font-family:var(--sans)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#app{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#sceneBG{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;image-rendering:pixelated;image-rendering:crisp-edges}
#sceneShop{width:100%;aspect-ratio:16/9;border-radius:12px;border:2px solid var(--line);box-shadow:0 4px 14px rgba(200,150,90,.18);image-rendering:pixelated;image-rendering:crisp-edges}

/* 柔和圆点底纹 */
.dots{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.25;
  background-image:radial-gradient(#e8d6ba 1.5px,transparent 1.5px);background-size:26px 26px}

/* 音乐按钮 */
#musicBtn{position:fixed;top:12px;right:12px;z-index:30;background:#fff;border:2px solid var(--line);
  color:var(--warm);font-size:13px;padding:7px 13px;border-radius:999px;box-shadow:0 2px 8px rgba(200,150,90,.25)}
#musicBtn:hover{border-color:var(--pink);color:var(--pink)}
#musicBtn.off{color:var(--dim)}

/* 打字机字幕 */
#subBar{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 0 30px;display:none}
#subInner{max-width:720px;margin:0 auto;background:rgba(255,253,248,.94);border:2px solid var(--line);
  border-bottom:none;border-radius:14px 14px 0 0;padding:16px 22px;min-height:84px;
  box-shadow:0 -6px 24px rgba(200,150,90,.18)}
#subText{font-size:18px;line-height:1.9;color:var(--txt);min-height:1.8em;white-space:pre-wrap;word-break:break-all;font-weight:500}
#subCursor{display:inline-block;width:10px;height:20px;background:var(--warm);vertical-align:-3px;margin-left:3px;border-radius:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#subHint{position:absolute;left:0;right:0;bottom:8px;z-index:21;text-align:center;color:var(--warm2);
  font-size:14px;letter-spacing:4px;opacity:.9;animation:blink 1.2s steps(1) infinite;text-shadow:0 1px 0 #fff}
.typing #subHint{display:none}

/* 通用屏幕 */
.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.screen.active{display:flex}
.panel{background:rgba(255,253,248,.96);border:2px solid var(--line);border-radius:16px;box-shadow:0 6px 22px rgba(200,150,90,.16),inset 0 1px 0 rgba(255,255,255,.8)}

/* 标题屏 */
#scr-title{z-index:12;background:linear-gradient(to bottom,rgba(255,246,234,.35),rgba(255,246,234,.75))}
#scr-title::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05) 60%,rgba(0,0,0,.12));pointer-events:none}
.logo{font-family:var(--pix);font-size:clamp(32px,7vw,64px);color:#fffdf8;letter-spacing:8px;text-shadow:3px 3px 0 #7a5a40,6px 6px 0 rgba(122,90,64,.35),0 0 24px rgba(247,223,154,.6)}
.logo .accent{color:var(--pink)}
.logoSub{font-family:var(--pix);font-size:clamp(11px,2vw,15px);color:#fff3c4;letter-spacing:10px;margin-top:10px;text-shadow:2px 2px 0 rgba(122,90,64,.5)}
.logoMeta{margin-top:14px;color:#fffdf8;font-size:14px;letter-spacing:2px;text-align:center;line-height:2;text-shadow:1px 1px 0 rgba(122,90,64,.4)}
.logoMeta b{color:#f7df9a;font-weight:bold}
.titleBtns{margin-top:28px;display:flex;flex-direction:column;gap:12px;width:min(300px,80vw)}
.btn{background:rgba(255,253,248,.92);border:2px solid var(--line);color:var(--txt);padding:12px 0;text-align:center;
  font-size:16px;letter-spacing:3px;border-radius:12px;transition:all .15s;box-shadow:0 3px 10px rgba(200,150,90,.2)}
.btn:hover:not(:disabled){border-color:var(--warm);background:var(--warm);color:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(232,147,74,.35)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.ghost:hover:not(:disabled){border-color:var(--dim);background:rgba(253,242,224,.9);color:var(--txt)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .small{font-size:12px;color:var(--dim);display:block;letter-spacing:1px;margin-top:4px;font-weight:normal}
.btn:hover .small{color:#fff}
.btn.primary{background:var(--warm);border-color:var(--warm2);color:#fff;font-weight:bold}
.btn.primary:hover{background:var(--warm2)}

/* 身份屏 */
#scr-id{background:rgba(255,246,234,.92);justify-content:flex-start;overflow:auto}
#idBox{width:min(780px,94vw);margin:auto;max-height:94vh;overflow:auto;padding:0 0 8px}
#idTop{padding:16px 20px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#portrait{width:180px;aspect-ratio:16/10;border-radius:12px;border:2px solid var(--line)}
#idTopTxt{flex:1;min-width:220px}
#idTopTxt .t{font-family:var(--pix);font-size:15px;color:var(--warm2);letter-spacing:2px}
#idTopTxt .s{margin-top:6px;font-size:13px;color:var(--dim);line-height:1.8}
#idInit{margin-top:8px;font-size:14px;line-height:2;color:var(--dim)}
#idInit b{color:var(--txt);font-weight:bold}
#idInit .g{color:var(--green);font-weight:bold}
#idFields{padding:6px 20px 0}
.idField{padding:12px 0;border-bottom:1px dashed var(--line)}
.idField label{display:block;font-size:13px;color:var(--warm2);font-weight:bold;margin-bottom:9px;letter-spacing:1px}
.idField label b{color:var(--txt);font-weight:bold}
.idInput{width:100%;background:#fff;border:2px solid var(--line);color:var(--txt);padding:11px 14px;font-size:16px;border-radius:10px;letter-spacing:1px}
.idInput:focus{outline:none;border-color:var(--warm)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:#fff;border:2px solid var(--line);color:var(--txt);padding:9px 15px;font-size:14px;border-radius:10px;transition:all .12s}
.chip:hover{border-color:var(--warm)}
.chip.on{border-color:var(--warm);color:var(--warm2);background:#fff4e4;font-weight:bold;box-shadow:0 0 0 3px rgba(232,147,74,.15)}
.chip .mini{display:block;font-size:11px;color:var(--dim);font-weight:normal;margin-top:2px}
.chip.locked{opacity:.5;position:relative}
.chip.locked:after{content:'通关后解锁';font-size:10px;color:var(--red);margin-left:5px}
#btnStart{margin:16px 20px 6px;background:var(--warm);border:2px solid var(--warm2);color:#fff;font-weight:bold;padding:14px;font-size:17px;letter-spacing:8px;border-radius:12px}
#btnStart:hover{background:var(--warm2)}
#idWarn{color:var(--red);font-size:13px;min-height:16px;padding:0 20px 4px}

/* 游戏屏 */
#scr-game{background:var(--bg);justify-content:flex-start;overflow:auto;padding:0}
#statStrip{width:100%;background:rgba(255,253,248,.96);border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;font-size:13px;
  box-shadow:0 3px 12px rgba(200,150,90,.12),inset 0 -1px 0 rgba(255,255,255,.8)}
.stat{flex:1;min-width:140px;padding:10px 16px;border-right:1px solid var(--line);white-space:nowrap}
.stat:last-child{border-right:none}
.stat .k{color:var(--dim);font-size:11px;letter-spacing:2px}
.stat .v{color:var(--txt);font-size:19px;margin-top:3px;font-weight:bold;font-family:var(--pix)}
.stat .v.pos{color:var(--green)} .stat .v.neg{color:var(--red)} .stat .v.warm{color:var(--warm2)}
#gameMain{width:min(1100px,98vw);margin:14px auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
#sceneCard{padding:12px;background:linear-gradient(180deg,#fffdf8,#fdf3e0);border-radius:16px;border:2px solid var(--line);box-shadow:0 6px 22px rgba(200,150,90,.16),inset 0 1px 0 rgba(255,255,255,.8)}
#scenTitle{font-size:17px;color:var(--warm2);font-weight:bold;letter-spacing:1px;padding:14px 4px 4px}
#scenText{font-size:15px;line-height:2;color:var(--txt);padding:4px 4px 10px;min-height:44px;white-space:pre-wrap;font-weight:500}
#optList{padding:0 4px 4px;display:flex;flex-direction:column;gap:9px}
.opt{background:rgba(255,255,255,.96);border:2px solid var(--line);color:var(--txt);padding:13px 15px;text-align:left;
  font-size:15px;line-height:1.7;border-radius:12px;transition:all .13s;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(200,150,90,.1)}
.opt .ol{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;font-weight:bold;
  display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px}
.opt .od{flex:1}
.opt:hover:not(:disabled){border-color:var(--warm);transform:translateY(-2px);box-shadow:0 5px 14px rgba(232,147,74,.22)}
.opt:disabled{opacity:.45;cursor:default}
.opt.sel{opacity:1;border-color:var(--warm);background:#fff4e4;box-shadow:0 0 0 3px rgba(232,147,74,.18)}
.opt.sel .ol{background:var(--warm)}
#explainBox{display:none;margin:4px 4px 0;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,#f2fbe8,#e8f5d8);border:2px solid #cde3b8}
#explainBox.on{display:block}
#explainBox .et{font-size:13px;color:#5a8a3e;font-weight:bold;margin-bottom:6px;letter-spacing:1px}
#explainBox .en{font-size:14px;line-height:1.95;color:#4a6a38}
#resultNote{margin:4px 4px 0;padding:12px 16px 14px;border-radius:12px;background:linear-gradient(135deg,#fff4e4,#ffe8cc);border:2px solid #f2d9b0;font-size:14px;line-height:1.8;color:var(--txt);box-shadow:0 2px 8px rgba(200,150,90,.12)}
#resultNote .rnNarr{margin-bottom:6px;font-size:13px;line-height:1.7;color:var(--warm2)}
#resultNote .rnBig{font-size:27px;font-weight:bold;text-align:center;line-height:1.35;letter-spacing:1px}
#resultNote .rnBig.pos{color:var(--green)} #resultNote .rnBig.neg{color:var(--red)}
#resultNote .rnBig .rnTag{display:block;font-size:11px;font-weight:normal;color:var(--dim);letter-spacing:2px;margin-top:2px}
#resultNote .rnCum{text-align:center;font-size:14px;margin-top:5px;color:var(--dim)}
#resultNote .rnCum b.pos{color:var(--green)} #resultNote .rnCum b.neg{color:var(--red)}
#modeDesc{margin:2px 4px 0;padding:10px 14px;border-radius:10px;background:#fdf6ea;border:1px dashed var(--amber);font-size:13px;line-height:1.95;color:var(--warm2)}
#modeDesc b{color:var(--warm)}
#btnHint{display:none;margin:10px 4px 0;background:#fff;border:2px dashed var(--amber);color:var(--warm2);
  padding:11px 16px;font-size:14px;border-radius:10px;transition:all .13s;letter-spacing:1px;width:100%;text-align:center}
#btnHint:hover:not(:disabled){background:#fff4e4;border-color:var(--warm);transform:translateY(-1px)}
#btnHint:disabled{opacity:.55;cursor:default}
#btnSettle2{display:none;margin:14px 4px 6px;background:var(--warm);border:2px solid var(--warm2);color:#fff;
  font-weight:bold;padding:14px;font-size:17px;letter-spacing:6px;border-radius:12px;width:100%}
#btnSettle2:hover{background:var(--warm2)}
/* 状态小条 */
#miniStats{margin-top:14px;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,#fffdf8,#fdf3e0);border:2px solid var(--line);
  display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;box-shadow:0 2px 8px rgba(200,150,90,.1)}
#miniStats .ms .k{color:var(--dim);font-size:12px}
#miniStats .ms .v{color:var(--warm2);font-weight:bold;font-family:var(--pix);margin-left:5px}
#goalLine{margin-top:10px;font-size:13px;color:var(--dim);line-height:1.7}
#goalLine b{color:var(--warm2)}

/* 结算弹层 */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(120,80,40,.35);backdrop-filter:blur(4px)}
#modal.on{display:flex}
#modalBox{width:min(440px,92vw);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#fffdf8,#fdf3e0);border-radius:18px;border:2px solid var(--line);
  box-shadow:0 14px 40px rgba(140,90,40,.3)}
#modalBox .panelTitle{font-size:15px;font-family:var(--pix);color:var(--warm2);letter-spacing:2px;padding:16px 20px 8px}
#settleBody{padding:4px 20px 12px;font-size:14px;line-height:2}
#settleBody .row{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:4px 0}
#settleBody .row .k{color:var(--dim)} #settleBody .row .v{color:var(--txt);font-weight:bold}
#settleBody .row.total{border:none;font-size:17px;padding-top:10px}
#settleBody .row.total .v.pos{color:var(--green)} #settleBody .row.total .v.neg{color:var(--red)}
#settleBody .warnLine{color:var(--red);font-size:13px;margin-top:8px}
#settleBody .okLine{color:var(--green);font-size:13px;margin-top:8px}
#btnSettle{width:100%;border:none;border-top:2px solid var(--line);background:var(--warm);color:#fff;
  font-weight:bold;padding:14px;font-size:16px;letter-spacing:6px;border-radius:0 0 16px 16px}
#btnSettle:hover{background:var(--warm2)}

/* 浮动小提示 */
#fxLayer{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}
.fxchip{position:absolute;font-size:13px;font-weight:bold;letter-spacing:1px;animation:fxup 1.5s ease forwards;white-space:nowrap;
  background:rgba(255,255,255,.96);border:2px solid var(--line);border-radius:8px;padding:3px 8px;box-shadow:0 3px 8px rgba(200,150,90,.2)}
.fxchip.p{color:var(--green);border-color:#b9d9a8} .fxchip.m{color:var(--red);border-color:#eec4b8} .fxchip.n{color:var(--warm2);border-color:#f2d9b0}
@keyframes fxup{0%{opacity:0;transform:translateY(10px) scale(.9)}12%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1)}}

/* 结果屏 */
#scr-result{background:rgba(255,246,234,.95);justify-content:flex-start;overflow:auto}
#resBox{width:min(680px,94vw);margin:auto;max-height:96vh;overflow:auto;padding:0 0 10px}
#resTitle{font-family:var(--pix);font-size:22px;letter-spacing:2px;padding:22px 24px 10px;text-align:center}
#resTitle.win{color:var(--green)} #resTitle.lose{color:var(--red)} #resTitle.over{color:var(--amber)}
#resTitle .sub{font-family:var(--sans);font-size:15px;color:var(--dim);letter-spacing:1px;margin-top:8px;font-weight:normal}
#resStats{padding:10px 24px;font-size:15px;line-height:2.2;background:linear-gradient(180deg,#fffdf8,#fdf3e0);margin:0 24px;border-radius:12px;border:2px solid var(--line)}
#resStats b{color:var(--warm2);font-weight:bold}
#resFootprint{padding:14px 24px;font-size:14px;line-height:2.1;color:var(--txt)}
#resFootprint .ft{font-family:var(--pix);font-size:13px;color:var(--warm2);letter-spacing:2px;margin-bottom:6px}
#resFootprint span.hl{color:var(--warm2);font-weight:bold}
#resRuns{font-size:13px;line-height:2.1;color:var(--dim);padding:0 24px}
#resBtns{display:flex;flex-direction:column;gap:12px;width:100%;padding:18px 24px 8px}
#resBtns .btn{width:100%}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--panel2)}
::-webkit-scrollbar-thumb{background:#e2cba6;border-radius:4px}
@media (max-width:900px){
  #gameMain{grid-template-columns:1fr}
  #subInner{font-size:16px}
  .stat{min-width:33.3%}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="sceneBG" width="320" height="180"></canvas>
  <div class="dots"></div>

  <!-- 打字机字幕层 -->
  <div id="subBar"><div id="subInner"><span id="subText"></span><span id="subCursor"></span></div></div>
  <div id="subHint">▶ 点击继续</div>

  <!-- 标题屏 -->
  <section id="scr-title" class="screen">
    <div class="logo">模拟<span class="accent">小店</span>经营</div>
    <div class="logoSub">COZY PIXEL SHOP</div>
    <div class="logoMeta">温馨模拟经营 · 经济学入门<br>你的选择，影响每一天</div>
    <div class="titleBtns">
      <button class="btn primary" id="btnNew">开始新游戏</button>
      <button class="btn" id="btnContinue" disabled>继续经营<span class="small" id="contInfo"></span></button>
      <button class="btn ghost" id="btnReset">重置存档</button>
    </div>
  </section>

  <!-- 身份屏 -->
  <section id="scr-id" class="screen">
    <div id="idBox" class="panel">
      <div id="idTop">
        <canvas id="portrait" width="200" height="125"></canvas>
        <div id="idTopTxt">
          <div class="t">★ 你的身份</div>
          <div class="s">被裁员的打工人，决定开一家自己的小店。<br>¥150,000 全投进店里，从 <b>¥0</b> 开始经营。</div>
          <div id="idInit"></div>
        </div>
      </div>
      <div id="idFields">
        <div class="idField"><label>姓名（<b>自定义</b>）</label>
          <input class="idInput" id="inpName" maxlength="8" placeholder="输入你的名字">
        </div>
        <div class="idField"><label>年龄（<b>自定义</b>）</label>
          <input class="idInput" id="inpAge" type="number" min="16" max="99" value="26" placeholder="输入你的年龄">
        </div>
        <div class="idField"><label>店铺类型（<b>你说了算</b>）</label>
          <div class="chips" id="chipsShop"></div>
        </div>
        <div class="idField"><label>经营目标</label>
          <div class="chips" id="chipsMode"></div>
          <div id="modeDesc"></div>
        </div>
        <div id="idWarn"></div>
        <button class="btn primary" id="btnStart" style="width:calc(100% - 40px);margin:14px 20px">开始经营 ▸</button>
      </div>
    </div>
  </section>

  <!-- 游戏屏 -->
  <section id="scr-game" class="screen">
    <div id="statStrip">
      <div class="stat"><div class="k">现金</div><div class="v" id="stCash">¥0.00</div></div>
      <div class="stat"><div class="k">本月累计净利</div><div class="v" id="stPl">¥0</div></div>
      <div class="stat"><div class="k">进度</div><div class="v" id="stMon">环节 1 / 10</div></div>
    </div>
    <div id="gameMain">
      <div>
        <div class="panel" id="sceneCard">
          <canvas id="sceneShop" width="320" height="180"></canvas>
          <div id="scenTitle"></div>
          <div id="scenText"></div>
          <div id="optList"></div>
          <div id="explainBox"><div class="et">📖 经济小课堂</div><div class="en" id="explainTxt"></div></div>
          <button id="btnHint">💡 购买提示（¥200）</button>
          <div id="resultNote" style="display:none"></div>
          <button id="btnSettle2">下一题 ▸</button>
          <div id="miniStats"></div>
          <div id="goalLine"></div>
        </div>
      </div>
      <div>
        <div class="panel" style="padding:18px 20px">
          <div style="font-family:var(--pix);font-size:13px;color:var(--warm2);letter-spacing:2px;margin-bottom:12px">经营小贴士</div>
          <div id="tipBox" style="font-size:14px;line-height:2;color:var(--txt)"></div>
          <div style="margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)">
            <div style="font-size:13px;color:var(--dim);margin-bottom:8px">本月大事记</div>
            <div id="logBody" style="font-size:13px;line-height:1.9;color:var(--dim)"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 结果屏 -->
  <section id="scr-result" class="screen">
    <div id="resBox" class="panel">
      <div id="resTitle" class="over">— 经营报告 —<div class="sub"></div></div>
      <div id="resStats"></div>
      <div id="resFootprint"></div>
      <div id="resRuns"></div>
      <div id="resBtns"></div>
    </div>
  </section>

  <!-- 结算弹层 -->
  <div id="modal"><div id="modalBox" class="panel">
    <div class="panelTitle">♨ 一个月经营 · 结算报告</div>
    <div id="settleBody"></div>
    <button id="btnSettle">查看结局 ▸</button>

/* ---------------- 音乐引擎（柔和芯片音乐） ---------------- */
const Midi=n=>440*Math.pow(2,(n-69)/12);
const AudioEngine={
  ctx:null, master:null, timer:null, current:null, muted:false,
  init(){ if(this.ctx) return;
    try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    this.master=this.ctx.createGain(); this.master.gain.value=0.22; this.master.connect(this.ctx.destination);
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  _tone(type,freq,start,dur,vol,dest){
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,start);
    g.gain.exponentialRampToValueAtTime(vol,start+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    o.connect(g); g.connect(dest||this.master);
    o.start(start); o.stop(start+dur+0.05);
  },
  playSong(name){
    if(!this.ctx||this.muted){ this.current=name; return; }
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    const s=SONGS[name]; if(!s) return;
    this.current=name;
    const step=60/s.bpm, look=0.18;
    let nextT=this.ctx.currentTime+0.06, idx=[0,0,0,0], trackT=[0,0,0,0];
    const tick=()=>{
      for(let tr=0;tr<s.tracks.length;tr++){
        const t=s.tracks[tr], seq=t.seq;
        while(trackT[tr] < this.ctx.currentTime-nextT+look){
          const ev=seq[idx[tr]%seq.length];
          if(ev[0]!==null){
            const dur=ev[1]*step;
            if(ev[0]===0){ this._noise(nextT,dur,t.vol); }
            else this._tone(t.type,Midi(ev[0]),nextT,dur,t.vol);
          }
          trackT[tr]+=ev[1]*step;
          idx[tr]++;
          if(idx[tr]>=seq.length) idx[tr]=0;
        }
      }
      nextT+=step/2;
    };
    this.timer=setInterval(tick,50);
    tick();
  },
  _noise(t,dur,vol){
    const len=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain(); g.gain.value=vol;
    src.connect(g); g.connect(this.master); src.start(t);
  },
  sfx(name){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime;
    const f=(n,d,v,type)=>{ if(n) this._tone(type||'triangle',Midi(n),t,d,v); };
    switch(name){
      case 'click': f(80,.08,.07); break;
      case 'coin': f(83,.1,.09); f(88,.12,.07,'triangle'); break;
      case 'buy': f(76,.1,.09); f(83,.13,.08); break;
      case 'hurt': f(64,.3,.07); f(55,.35,.05); break;
      case 'win': [72,76,79,84,88].forEach((n,i)=>setTimeout(()=>this._tone('triangle',Midi(n),this.ctx.currentTime,.16,.08),i*100)); break;
      case 'lose': [72,69,64,57].forEach((n,i)=>setTimeout(()=>this._tone('sawtooth',Midi(n),this.ctx.currentTime,.2,.04),i*120)); break;
      case 'cash': f(84,.06,.06); f(91,.07,.05,'triangle'); break;
    }
  }
};

function putSprite(ctx,map,pal,x,y,flip){
  for(let r=0;r<map.length;r++){
    const row=map[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c]; if(ch==='.'||ch===' ') continue;
      const col=pal[ch]; if(!col) continue;
      ctx.fillStyle=col; ctx.fillRect(x+(flip?row.length-1-c:c),y+r,1,1);
    }
  }
}
/* 画小女孩：pose = stand|walk|wave|sit|think|jump */
function drawGirl(ctx,x,y,t,pose){
  let fr=SPR_G_A, bob=0;
  if(pose==='walk'){ fr=(Math.floor(t*4)%2)?SPR_G_B:SPR_G_A; bob=(Math.floor(t*4)%2)?1:0; }
  putSprite(ctx,fr,PAL_G,x,y+bob);
  // 双马尾
  const sw=Math.floor(Math.sin(t*3))*0; // 静止
  R(ctx,x-3, y+2+sw, 3, 6, PAL_G.X);

  R(ctx,x-4, y+1, 2, 2, PAL_G.C);  // 左发圈
  R(ctx,x+14,y+1, 2, 2, PAL_G.C);  // 右发圈

    const a=Math.floor(t*3)%2;

    R(ctx,x+10+a,y+5,2,3,PAL_G.C);
    R(ctx,x+10+a,y+4,2,2,PAL_G.S);
  }
  if(pose==='sit'){ // 坐姿：稍微矮一点 + 腿前伸（由前景覆盖）
    putSprite(ctx,SPR_G_A,PAL_G,x,y+3);
  }
  if(pose==='think'){ // 仰望：头顶小星星
    const sy=y-6-Math.floor((t*1.2)%3);

}

     cash:START_CASH, month:1, demand:58, price:1.0, rep:48, cust:52, emp:60, supp:60, comm:50,
     revenue:0, expense:0, profit:0, totalProfit:0, totalRev:0, totalExp:0, peakProfit:0, losses:0,
     mods:{fixedExtra:0,costExtra:0,loanPay:0},
     log:[], series:{cash:[START_CASH],profit:[0]}, usedEvents:[], win:false, over:null, answeredMonth:0};
  if(mode==='rep'){ S.rep+=5; S.comm+=3; }
}
function goalText(){
  if(S.mode==='rep') return '口碑模式：声誉 ≥80 · 员工 ≥70 · 社区 ≥70 · 顾客 ≥70 · 不破产';
  return '利润模式：本月累计净利润 ≥ ¥'+fmtI(PROFIT_GOAL);
}
function goalProgress(){
  if(S.mode==='rep'){
    const ok=[S.rep>=80,S.emp>=70,S.comm>=70,S.cust>=70,S.cash>BANKRUPT_LINE];
    return ok.filter(Boolean).length/5;
  }
  return clamp(S.totalProfit/PROFIT_GOAL,0,1);
}
const FX_LABEL={demand:'需求',price:'价格',rep:'声誉',cust:'顾客',emp:'员工',supp:'供应商',comm:'社区',cash:'现金'};
function applyFx(fx,from){
  const parts=[];
  for(const k in fx){
    const v=(typeof fx[k]==='function')?fx[k]():fx[k];
    if(k==='demand'){ S.demand=clamp(S.demand+v,10,130); }
    else if(k==='price'){ S.price=clamp(S.price+v,0.6,1.6); }
    else if(k==='rep'){ S.rep=clamp(S.rep+v,0,100); }
    else if(k==='cust'){ S.cust=clamp(S.cust+v,0,100); }
    else if(k==='emp'){ S.emp=clamp(S.emp+v,0,100); }
    else if(k==='supp'){ S.supp=clamp(S.supp+v,0,100); }
    else if(k==='comm'){ S.comm=clamp(S.comm+v,0,100); }
    else if(k==='cash'){ S.cash+=v; }
    else if(k==='costExtra'){ S.mods.costExtra=clamp(S.mods.costExtra+v,-0.08,0.12); }
    else if(k==='fixedExtra'){ S.mods.fixedExtra=clamp(S.mods.fixedExtra+v,0,4000); }
    else if(k==='loanPay'){ S.mods.loanPay+=v; }
    parts.push({label:FX_LABEL[k]||k,v});
  }
  if(from&&parts.length) addLog('市场波动：'+parts.map(p=>(p.v>=0?'+':'')+Math.round(p.v)+' '+p.label).join(' · '));
  spawnChips(parts);
  AudioEngine.sfx(fx.cash>0?'cash':(fx.cash<0?'buy':'click'));
}
/* —— 环节结算（每环节 = 3 天，10 环节 = 1 个月） —— */
function settle(){
  const cfg=SHOP_CFG[S.shopType];
  const d=clamp(S.demand,0,130), r=clamp(S.rep,0,100);
  const flow=cfg.baseFlow*(d/100)*(0.5+r/100*0.5);
  const priceA=cfg.basePrice*clamp(S.price,0.6,1.6);
  const days=3;
  const revenue=flow*priceA*days;
  const purch=revenue*cfg.pur*(1.2-clamp(S.supp,0,100)/250)+revenue*S.mods.costExtra;
  const fixed=(cfg.fixed+S.mods.fixedExtra)*days/30;
  const labor=EMP*4000*(1.1-clamp(S.emp,0,100)/200)*days/30;
  const overdraft=S.cash<0 ? -S.cash*0.06 : 0;   // 现金透支按 6%/环节 罚息，逼玩家先解决现金流
  const expense=fixed+Math.max(0,purch)+labor+overdraft+S.mods.loanPay*days/30;
  const profit=revenue-expense;
  S.cash+=profit;
  S.revenue=revenue; S.expense=expense; S.profit=profit;
  S.totalProfit+=profit; S.totalRev+=revenue; S.totalExp+=expense;
  S.peakProfit=Math.max(S.peakProfit,profit);
  if(profit<0) S.losses++; else S.losses=0;
  S.series.cash.push(S.cash);
  S.series.profit.push(profit);
  const decay=[];
  if(S.price>1.2){ S.demand-=2; S.cust-=2; decay.push('定价偏高，客流略降'); }
  if(S.emp<45){ S.cust-=2; decay.push('员工情绪低，服务打折'); }
  if(S.cust<45){ S.demand-=2; decay.push('口碑转差，客流下降'); }
  if(S.supp<35){ S.mods.costExtra=Math.min(0.12,S.mods.costExtra+0.01); decay.push('供应商收紧账期，采购变贵'); }
  S.demand=clamp(S.demand,10,130); S.cust=clamp(S.cust,0,100);
  return {flow,priceA,revenue,purch,fixed,labor,expense,profit,decay};
}
/* —— 选择选项 —— */
let lastSettle=null;
function choose(opt,b){
  b.disabled=true;
  Array.from($('optList').children).forEach(x=>{ if(x!==b) x.disabled=true; });
  b.classList.add('sel');
  addLog('你选择了「'+opt.l+'」');
  // 经济小课堂（无论是否买过提示都会出现）
  const sc=SCEN[S.month-1];
  $('explainTxt').textContent=sc.explain;
  $('explainBox').classList.add('on');
  $('btnHint').style.display='none';
  // 应用影响（此时才显示浮动数字，玩家已选完）
  applyFx(opt.fx);
  AudioEngine.sfx('coin');
  renderMini();
  // 内部结算：实时更新现金/累计利润，但不打断答题
  addLog('—— 环节 '+S.month+'/'+MAX_MONTH+' 经营 ——');
  const r=settle();
  lastSettle=r;
  addLog('本环节净利 '+fmtS(r.profit)+'（本月累计 '+fmtS(S.totalProfit)+'）');
  r.decay.forEach(tx=>addLog('⚠ '+tx));
  // 醒目结算卡：只显示这题赚/亏了多少 + 本月累计
  const note=$('resultNote');
  note.style.display='block';
  note.innerHTML=
    '<div class="rnNarr">『'+opt.n+'』</div>'+
    '<div class="rnBig '+(r.profit>=0?'pos':'neg')+'">'+(r.profit>=0?'+':'')+'¥'+fmtI(r.profit)+
      '<span class="rnTag">'+(r.profit>=0?'本环节净赚':'本环节亏了')+'</span></div>'+
    '<div class="rnCum">本月累计净利润：<b class="'+(S.totalProfit>=0?'pos':'neg')+'">'+(S.totalProfit>=0?'+':'')+'¥'+fmtI(S.totalProfit)+'</b></div>';
  nextMonthEvent();
  S.answeredMonth=S.month;
  renderStats();
  const btn=$('btnSettle2'); btn.style.display='block'; btn.style.borderColor='var(--warm2)';
  if(S.cash<=BANKRUPT_LINE){ btn.textContent='查看结局 ▸'; btn.style.borderColor='var(--red)'; }
  else if(S.month>=MAX_MONTH){ btn.textContent='查看经营报告 ▸'; }
  else { btn.textContent='下一环节 ▸'; }
  saveGame();
}

$('btnSettle2').onclick=()=>{
  AudioEngine.sfx('click');
  if(S.cash<=BANKRUPT_LINE){ endGame('bankrupt'); return; }
  if(S.month>=MAX_MONTH){ showFinalSettle(); return; }
  S.month++;
  saveGame();
  renderAll(); showScen();
};
function checkWin(){
  if(S.mode==='rep') return S.rep>=80&&S.emp>=70&&S.comm>=70&&S.cust>=70&&S.cash>BANKRUPT_LINE;
  return S.totalProfit>=PROFIT_GOAL&&S.cash>BANKRUPT_LINE;
}
function nextMonthEvent(){
  const pool=EVENTS.filter(e=>!S.usedEvents.includes(e.t));
  if(!pool.length) return;
  const ev=pool[Math.floor(Math.random()*pool.length)];
  S.usedEvents.push(ev.t);
  addLog('本月市场：'+ev.t);
  applyFx(ev.fx);
}

  b.innerHTML='<div style="font-size:13px;color:var(--dim);margin-bottom:4px">10 个环节答完 · 一个月经营结束</div>'+
    '<div class="row"><span class="k">本月总收入（10 环节）</span><span class="v" style="color:var(--green)">+¥'+fmtI(S.totalRev)+'</span></div>'+
    '<div class="row"><span class="k">本月总支出（10 环节）</span><span class="v">-¥'+fmtI(S.totalExp)+'</span></div>'+
    '<div class="row total"><span class="k">本月累计净利润</span><span class="v '+(S.totalProfit>=0?'pos':'neg')+'">'+(S.totalProfit>=0?'+':'')+'¥'+fmtI(S.totalProfit)+'</span></div>'+
    '<div class="row"><span class="k">手头现金</span><span class="v" style="color:var(--warm2)">'+fmtC(S.cash)+'</span></div>'+
    (ok?'<div class="okLine">✓ 通关达成：本月累计净利润 ≥ ¥'+fmtI(PROFIT_GOAL)+'</div>':'<div class="warnLine">未达通关线：'+goalText()+'</div>');
  $('modal').classList.add('on');
  $('btnSettle').textContent='查看结局 ▸';
  $('btnSettle').onclick=()=>{
    $('modal').classList.remove('on');
    AudioEngine.sfx('click');
    endGame(ok?'win':'timeout');
  };
}
/* —— 结束 —— */
function endGame(kind){
  S.over=kind; S.win=(kind==='win');
  AudioEngine.sfx(kind==='win'?'win':'lose');
  saveRun();
  showResult();
}
/* —— HUD（简洁：现金 / 本月累计净利 / 进度） —— */
function renderStats(){
  $('stCash').textContent=fmtC(S.cash);
  $('stCash').className='v'+(S.cash<0?' neg':'');
  const p=$('stPl'); p.textContent=(S.totalProfit>=0?'+':'')+'¥'+fmtI(S.totalProfit);
  p.className='v'+(S.totalProfit>=0?' pos':' neg');
  $('stMon').textContent='环节 '+S.month+' / '+MAX_MONTH;
}
function renderMini(){
  if(!S) return;
  $('miniStats').innerHTML=
    '<span class="ms"><span class="k">需求</span><span class="v">'+Math.round(S.demand)+'</span></span>'+
    '<span class="ms"><span class="k">声誉</span><span class="v">'+Math.round(S.rep)+'</span></span>'+
    '<span class="ms"><span class="k">顾客</span><span class="v">'+Math.round(S.cust)+'</span></span>'+
    '<span class="ms"><span class="k">员工</span><span class="v">'+Math.round(S.emp)+'</span></span>'+
    '<span class="ms"><span class="k">供应商</span><span class="v">'+Math.round(S.supp)+'</span></span>'+
    '<span class="ms"><span class="k">社区</span><span class="v">'+Math.round(S.comm)+'</span></span>';
}
function renderGoalLine(){
  $('goalLine').innerHTML='<b>利润模式：</b>答完 10 个环节（= 经营 1 个月）后，<b>本月累计净利润 ≥ ¥'+fmtI(PROFIT_GOAL)+'</b> 即通关'+
    '<br><b>口碑模式：</b>声誉≥80 · 员工≥70 · 社区≥70 · 顾客≥70 · 不破产'+
    (NG_UNLOCK?' <span style="color:var(--green)">✓ 已解锁</span>':' <span style="color:var(--dim)">（通关利润模式后解锁）</span>');
}
function addLog(txt){
  const div=document.createElement('div');
  div.style.padding='2px 0';
  div.textContent=txt;
  const body=$('logBody');
  body.insertBefore(div,body.firstChild);
  while(body.children.length>12) body.removeChild(body.lastChild);
}
function renderAll(){ renderStats(); renderMini(); renderGoalLine(); }
/* —— 浮动数值 —— */
function spawnChips(parts){
  const layer=$('fxLayer');
  parts.forEach((p,i)=>{
    if(p.label==='采购成本'||p.label==='固定成本'||p.label==='月还款') return;
    const d=document.createElement('div');
    d.className='fxchip '+(p.v>=0?'p':'m');
    d.textContent=(p.v>=0?'+':'')+Math.round(p.v)+' '+p.label;
    d.style.left=(30+Math.random()*40)+'%';
    d.style.top=(30+Math.random()*18)+'%';
    d.style.animationDelay=(i*0.12)+'s';
    layer.appendChild(d);
    setTimeout(()=>d.remove(),1600+i*120);
  });
}
/* ============================================================
   界面流程
============================================================ */
const SCR={title:'scr-title',id:'scr-id',game:'scr-game',result:'scr-result'};
let bgMode='title', curScreen='title';
function showScreen(name){
  curScreen=name;
  Object.values(SCR).forEach(id=>$(id).classList.toggle('active',id===SCR[name]));
  $('subBar').style.display=(name==='story')?'block':'none';
  $('subHint').style.display=(name==='story')?'block':'none';
}
/* —— 打字机 —— */
let typeTimer=null;
function typeText(el,text,cb,spd){
  clearInterval(typeTimer);
  el.textContent=''; $('app').classList.remove('typing');
  let i=0; const speed=spd||42;
  typeTimer=setInterval(()=>{
    i+=2;
    el.textContent=text.slice(0,i);
    if(i>=text.length){ clearInterval(typeTimer); typeTimer=null; if(cb)cb(); }
  },speed);
}
function finishTyping(){
  if(typeTimer){ clearInterval(typeTimer); typeTimer=null;
    const el=$('subText'); if(STORY_LINES && STORY_LINES[lineIdx]!==undefined) el.textContent=STORY_LINES[lineIdx];
  }
}
/* —— 章节 1.1（精简版） —— */
const CHAPTER1=[
 {scene:'dream',lines:['辞职后，你决定用全部积蓄开一家自己的小店。']}
];
let STORY_LINES=null, chapterIdx=0, lineIdx=0;
function startStory(){
  showScreen('story'); chapterIdx=0; lineIdx=0;
  AudioEngine.playSong('story');
  playChapter();
}
function playChapter(){
  const ch=CHAPTER1[chapterIdx];
  STORY_LINES=ch.lines; lineIdx=0;
  bgMode=ch.scene;
  typeLine();
}
function typeLine(){
  $('app').classList.add('typing');
  typeText($('subText'),STORY_LINES[lineIdx],()=>$('app').classList.remove('typing'),36);
}
function storyClick(){
  if(typeTimer){ finishTyping(); return; }
  lineIdx++;
  if(lineIdx<STORY_LINES.length){ typeLine(); return; }
  chapterIdx++;
  if(chapterIdx<CHAPTER1.length){ playChapter(); return; }
  showIdentity();
}
/* —— 身份设定 —— */
let idSel={shop:'coffee',mode:'profit'};
function showIdentity(modePreset){
  if(modePreset) idSel.mode=modePreset;
  showScreen('id');
  AudioEngine.playSong('title');
  buildChips();
  drawPortrait();
  $('inpName').value=S&&S.name?S.name:'';
  $('inpAge').value=(S&&S.age)?S.age:'26';
  refreshInit();
}
function buildChips(){
  const chip=(arr,val,label,mini)=>{
    const d=document.createElement('button');
    d.className='chip'+(val===idSel[arr]?' on':'');
    d.innerHTML=label+(mini?'<span class="mini">'+mini+'</span>':'');
    d.onclick=()=>{ idSel[arr]=val; buildChips(); refreshInit(); drawPortrait(); AudioEngine.sfx('click'); };
    return d;
  };
  const cs=$('chipsShop'); cs.innerHTML='';
  Object.keys(SHOP_CFG).forEach(k=>{ cs.appendChild(chip('shop',k,SHOP_CFG[k].name)); });
  const cm=$('chipsMode'); cm.innerHTML='';
  cm.appendChild(chip('mode','profit','利润模式','本月累计净利 ≥ ¥'+fmtI(PROFIT_GOAL)));
  const r=chip('mode','rep','口碑模式',NG_UNLOCK?'声誉≥80·员工≥70·社区≥70·顾客≥70':'通关后解锁');
  if(!NG_UNLOCK){ r.classList.add('locked'); r.disabled=true; }
  cm.appendChild(r);
  const md=$('modeDesc');
  if(idSel.mode==='rep'){
    md.innerHTML='<b>口碑模式怎么通关：</b>答完 10 个环节（= 经营 1 个月）后<br>'+
      '声誉 ≥ <b>80</b> · 员工 ≥ <b>70</b> · 社区 ≥ <b>70</b> · 顾客 ≥ <b>70</b> · 不破产<br>'+
      '不看利润，但一直亏钱，店也撑不到最后。';
  }else{
    md.innerHTML='<b>利润模式怎么通关（大白话）：</b><br>'+
      '这一个月共 <b>10 个经营环节</b>（答 10 题，每答一题结算一次）。<br>'+
      '答完 10 题后，<b>本月累计净利润 ≥ ¥'+fmtI(PROFIT_GOAL)+'</b> 就算通关<br>'+
      '（≈ 这家店一个月净赚 ¥'+fmtI(PROFIT_GOAL)+'，平均每天净赚 ¥'+fmtI(Math.round(PROFIT_GOAL/30))+' 出头）。<br>'+
      '<span style="color:var(--dim)">你从 ¥0 起步——¥150,000 已经全部投进开店。'+
      '每一题赚了、亏了，都直接进你的现金；欠款超过 ¥'+fmtI(-BANKRUPT_LINE)+' 会倒闭。</span>';
  }
}
function refreshInit(){
  $('idInit').innerHTML=
    '开店投入：<b class="g">¥150,000</b>（装修 · 设备 · 押金，已花完）<br>'+
    '启动现金：<b class="g">¥0</b> · 员工：<b>0</b> · 本月收入：<b class="g">¥0</b> · 本月支出：<b class="g">¥0</b>';
}
function drawPortrait(){
  const c=ctxPor; c.clearRect(0,0,200,125);
  R(c,0,0,200,125,'#bfe0f2');
  R(c,0,0,200,46,'#a8d4ea'); R(c,0,40,200,8,'#e8f4d8');
  R(c,0,100,200,25,'#e8d0b0'); R(c,0,98,200,2,'#d4b890');
  const col=SHOP_PAL[idSel.shop].col;
  R(c,26,28,148,12,'#a87a4e');
  c.fillStyle='#fffdf8'; c.font='bold 10px "Microsoft YaHei",sans-serif';
  const sign=($('inpName').value||'小美')+'的'+SHOP_PAL[idSel.shop].name+'店';
  c.fillText(sign,100-c.measureText(sign).width/2,37);
  R(c,22,40,156,10,col);
  for(let k=0;k<19;k++) if(k%2) R(c,22+k*8,40,4,10,'rgba(120,80,40,.3)');
  R(c,32,50,136,48,'#fdf3e0');
  R(c,40,54,52,26,'#fff3c4'); R(c,42,56,20,12,'#e8b48c'); R(c,66,56,20,12,'#f2c94c');
  R(c,96,50,16,52,'#a87a4e');
  R(c,118,54,52,26,'#fff3c4'); R(c,128,70,24,10,'#c8a080');
  R(c,34,96,136,2,'#e8d6ba');
  drawGirl(c,168,84,0.3,'stand');
}
function startGame(){
  const name=($('inpName').value||'').trim();
  if(!name){ $('idWarn').textContent='✗ 先给小女孩起个名字吧'; return; }
  const age=($('inpAge').value||'').trim();
  if(!age||+age<16||+age>99){ $('idWarn').textContent='✗ 年龄请填 16~99 之间的数字'; return; }
  $('idWarn').textContent='';
  newState(idSel.mode,{name,shop:idSel.shop,age});
  saveGame();
  showScreen('game');
  bgMode='game';
  AudioEngine.playSong('game');
  AudioEngine.sfx('coin');
  $('scenTitle').textContent=''; $('scenText').textContent=''; $('optList').innerHTML='';
  $('logBody').innerHTML='';
  addLog('欢迎，'+S.name+'！你的小店开张啦 ✿ 这是第一个月的第 1 个经营环节。');
  renderAll();
  showScen();
}
/* —— 存档 —— */
const SAVE_KEY='pixelShop.save.v1';
function saveGame(){ if(!S) return; localStorage.setItem(SAVE_KEY,JSON.stringify({S,idSel})); }
function saveRun(){
  const rec={mode:S.mode,result:S.over,name:S.name,shop:S.shopType,months:S.month,
    cash:S.cash,peak:Math.round(S.totalProfit),rep:S.rep,emp:S.emp,cust:S.cust,supp:S.supp,comm:S.comm};
  RUNS.unshift(rec); if(RUNS.length>12) RUNS.length=12;
  localStorage.setItem('pixelShop.runs.v1',JSON.stringify(RUNS));
  NG_UNLOCK=true;
  localStorage.removeItem(SAVE_KEY);
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const obj=JSON.parse(raw); S=obj.S; idSel=obj.idSel||idSel;
    return true;
  }catch(e){ return false; }
}
function resetSave(){
  if(!confirm('确定要重置存档和历史记录吗？')) return;
  localStorage.removeItem(SAVE_KEY); localStorage.removeItem('pixelShop.runs.v1');
  RUNS.length=0; NG_UNLOCK=false;
  refreshTitle();
}
/* —— 标题 —— */
function refreshTitle(){
  const ok=loadGame();
  $('btnContinue').disabled=!ok;
  if(ok){
    $('btnContinue').innerHTML='继续经营<span class="small">'+S.name+' · 环节'+S.month+'/'+MAX_MONTH+' · '+(S.mode==='rep'?'口碑模式':'利润模式')+'</span>';
  }else{
    $('btnContinue').innerHTML='继续经营<span class="small">（暂无存档）</span>';
  }
}
function showTitle(){
  showScreen('title'); bgMode='title';
  AudioEngine.playSong('title');
  refreshTitle();
}
/* —— 结果报告（简约温馨） —— */
const KIND_TXT={
  win:['目标达成！','你的小店这个月跑出了盈利','win'],
  bankrupt:['小店倒闭了…','欠款超过 ¥'+fmtI(-BANKRUPT_LINE)+'，现金流断裂。没关系，再来一局吧','lose'],
  timeout:['时间到了','一个月经营结束，店还活着，但没到通关线','over']
};
function showResult(){
  showScreen('result');
  const k=KIND_TXT[S.over];
  const t=$('resTitle'); t.textContent=k[0]; t.className=k[2];
  t.innerHTML=k[0]+'<div class="sub">'+k[1]+'</div>';
  const cfg=SHOP_CFG[S.shopType];
  const welfare=Math.round((S.emp+S.cust+S.supp+S.comm)/4);
  const sustain=S.series.profit.filter(p=>p>0).length;
  $('resStats').innerHTML=
    '<b>店主：</b>'+S.name+'（'+S.age+'岁）　<b>店铺：</b>'+cfg.name+'<br>'+
    '<b>模式：</b>'+(S.mode==='rep'?'口碑模式':'利润模式')+'<br>'+
    '<b>经营环节：</b>'+S.month+' / '+MAX_MONTH+'　<b>本月累计净利：</b>'+(S.totalProfit>=0?'+':'')+'¥'+fmtI(S.totalProfit)+'<br>'+
    '<b>最终现金：</b>'+fmtC(S.cash)+'　<b>最后环节净利：</b>'+(S.profit>=0?'+':'')+'¥'+fmtI(S.profit);
  $('resFootprint').innerHTML=
    '<div class="ft">♨ 经济足迹</div>'+
    '声誉 <span class="hl">'+Math.round(S.rep)+'</span> · 顾客 <span class="hl">'+Math.round(S.cust)+'</span> · 员工 <span class="hl">'+Math.round(S.emp)+'</span> · 供应商 <span class="hl">'+Math.round(S.supp)+'</span> · 社区 <span class="hl">'+Math.round(S.comm)+'</span><br>'+
    '盈利环节：'+sustain+'/'+Math.max(1,S.series.profit.length)+' 个环节为正<br>'+
    '<span class="hl">综合福祉评分：'+welfare+'/100</span>　—— 利润不是唯一的目标';
  $('resRuns').innerHTML=RUNS.length?'<div style="font-size:13px;color:var(--dim);margin-bottom:4px">历史足迹</div>'+RUNS.map((r,i)=>
    '<div>'+(i+1)+'. '+(r.mode==='rep'?'[口碑]':'[利润]')+
    (r.result==='win'?'<b style="color:var(--green)">通关</b>':r.result==='bankrupt'?'<b style="color:var(--red)">倒闭</b>':'<b style="color:var(--amber)">时间到</b>')+
    ' · '+r.name+' · '+r.months+'月 · 现金'+fmtC(r.cash)+'</div>').join(''):'';
  const btns=$('resBtns'); btns.innerHTML='';
  const b1=document.createElement('button'); b1.className='btn primary'; b1.innerHTML='再来一局 · '+(S.mode==='rep'?'口碑模式':'利润模式');
  b1.onclick=()=>{ AudioEngine.sfx('click'); showIdentity(S.mode); };
  btns.appendChild(b1);
  if(NG_UNLOCK&&S.mode==='profit'){
    const b2=document.createElement('button'); b2.className='btn'; b2.style.borderColor='var(--amber)'; b2.style.color='var(--warm2)';
    b2.innerHTML='二周目 · 口碑模式<span class="small">不同目标：五项福祉达标</span>';
    b2.onclick=()=>{ AudioEngine.sfx('buy'); showIdentity('rep'); };
    btns.appendChild(b2);
  }
  const b3=document.createElement('button'); b3.className='btn ghost'; b3.textContent='回到标题';
  b3.onclick=()=>{ AudioEngine.sfx('click'); showTitle(); };
  btns.appendChild(b3);
  AudioEngine.playSong(S.over==='win'?'win':'over');
}
/* —— 主循环 —— */
let ANIMT=0;
function loop(){
  ANIMT+=1/60;
  if(bgMode==='title') drawCoverScene(ANIMT);
  else if(bgMode==='apt') drawApt(ANIMT);
  else if(bgMode==='office') drawOffice(ANIMT);
  else if(bgMode==='street') drawStreet(ANIMT);
  else if(bgMode==='dream') drawDream(ANIMT);
  else drawStreet(ANIMT);
  if(curScreen==='game') drawShopScene(ANIMT);
  requestAnimationFrame(loop);
}
/* —— 事件 —— */
let audioReady=false;
function ensureAudio(){
  if(audioReady) return; audioReady=true;
  AudioEngine.init(); AudioEngine.resume();
  AudioEngine.playSong(AudioEngine.current||'title');
}
document.addEventListener('click',e=>{
  if(!audioReady){ ensureAudio(); }
  if(curScreen==='story' && !e.target.closest('button,input,select,label,a')){ storyClick(); }
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(curScreen==='story'){ storyClick(); }
    else if($('modal').classList.contains('on')){ $('btnSettle').click(); }
  }
});
$('btnNew').onclick=()=>{ AudioEngine.sfx('click'); startStory(); };
$('btnContinue').onclick=()=>{
  if(!loadGame()) return;
  AudioEngine.sfx('click'); showScreen('game'); bgMode='game'; AudioEngine.playSong('game'); renderAll();
  if(S.over) showResult();
  else if(S.month>MAX_MONTH){ S.over='timeout'; saveRun(); showResult(); }
  else showScen();
};
$('btnReset').onclick=()=>{ AudioEngine.sfx('click'); resetSave(); };
$('btnStart').onclick=()=>{ AudioEngine.sfx('click'); startGame(); };
$('inpName').addEventListener('input',()=>drawPortrait());
$('btnHint').onclick=()=>{
  if(!S||S.cash<HINT_PRICE) return;
  AudioEngine.sfx('buy');
  S.cash-=HINT_PRICE;
  const sc=SCEN[S.month-1];
  $('explainTxt').textContent=sc.explain;
  $('explainBox').classList.add('on');
  const hb=$('btnHint'); hb.disabled=true; hb.textContent='✔ 已购买提示';
  addLog('花费 ¥'+fmtI(HINT_PRICE)+' 购买经济提示');
  renderStats(); renderMini();
};
$('musicBtn').onclick=()=>{
  AudioEngine.muted=!AudioEngine.muted;
  $('musicBtn').classList.toggle('off',AudioEngine.muted);
  $('musicBtn').textContent=AudioEngine.muted?'♪ 音乐关':'♪ 音乐开';
  if(AudioEngine.muted) AudioEngine.playSong('title');
};
/* —— 启动 —— */
refreshTitle();
showTitle();
loop();
</script>
