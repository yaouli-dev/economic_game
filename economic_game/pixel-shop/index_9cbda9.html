<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf4e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Pixel Shop · Cozy Business Sim</title>
<style>
:root{
  --bg:#fdf4e6; --bg2:#f7ead5; --panel:#fffdf8; --panel2:#fdf2e0;
  --line:#e0cca8; --line2:#d4b890;
  --txt:#4a3826; --dim:#9a8060; --warm:#e8934a; --warm2:#c86a28;
  --pink:#e88aa0; --pink2:#c86882; --green:#5fa84e; --green2:#4a8a3a;
  --red:#d96a5a; --red2:#b85040; --amber:#d9a441; --amber2:#b88830;
  --wood:#c89a6a; --woodD:#a87a4e;
  --shadow:0 4px 16px rgba(160,110,60,.18);
  --shadowLg:0 8px 28px rgba(160,110,60,.22);
  --shadowSm:0 2px 8px rgba(160,110,60,.12);
  --sans:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
  --pix:'Courier New',monospace;
  --cute:'Quicksand','Comfortaa','Comic Sans MS','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
button{font-family:var(--sans);cursor:pointer;user-select:none}
input,select{font-family:var(--sans)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#app{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#sceneBG{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;image-rendering:pixelated;image-rendering:crisp-edges}
#sceneShop{width:100%;aspect-ratio:16/9;border-radius:12px;border:2px solid var(--line);box-shadow:var(--shadow);image-rendering:pixelated;image-rendering:crisp-edges}

/* 柔和圆点底纹 */
.dots{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.2;
  background-image:radial-gradient(#c8a878 1.5px,transparent 1.5px);background-size:28px 28px}

/* 语言切换按钮（醒目渐变胶囊） */
#langBtn{position:fixed;top:12px;right:12px;z-index:30;
  background:linear-gradient(135deg,#ffd9a8 0%,#f7b8d0 100%);
  border:2px solid var(--warm2);color:#7a4020;font-size:13px;font-weight:800;
  padding:8px 16px 8px 14px;border-radius:999px;box-shadow:0 3px 12px rgba(232,147,74,.28);
  transition:all .18s;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
#langBtn::before{content:'🌐';font-size:14px;filter:saturate(1.1)}
#langBtn:hover{border-color:var(--pink2);box-shadow:0 4px 16px rgba(232,138,160,.35);transform:translateY(-1px) scale(1.02)}
#langBtn:active{transform:translateY(0) scale(.98)}

/* 打字机字幕 */
#subBar{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 0 30px;display:none}
#subInner{max-width:720px;margin:0 auto;background:rgba(255,253,248,.95);border:2px solid var(--line);
  border-bottom:none;border-radius:14px 14px 0 0;padding:16px 22px;min-height:84px;
  box-shadow:0 -6px 24px rgba(200,150,90,.18)}
#subText{font-size:18px;line-height:1.9;color:var(--txt);min-height:1.8em;white-space:pre-wrap;word-break:break-all;font-weight:500}
#subCursor{display:inline-block;width:10px;height:20px;background:var(--warm);vertical-align:-3px;margin-left:3px;border-radius:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#subHint{position:absolute;left:0;right:0;bottom:8px;z-index:21;text-align:center;color:var(--warm2);
  font-size:14px;letter-spacing:4px;opacity:.9;animation:blink 1.2s steps(1) infinite;text-shadow:0 1px 0 #fff}
.typing #subHint{display:none}

/* 通用屏幕 */
.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.screen.active{display:flex}
.panel{background:linear-gradient(180deg,rgba(255,253,248,.98),rgba(253,242,224,.92));border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadowLg),inset 0 1px 0 rgba(255,255,255,.9)}

/* 标题屏 */
#scr-title{z-index:12;background:linear-gradient(to bottom,rgba(253,244,230,.25),rgba(253,244,230,.8))}
#scr-title::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.03) 50%,rgba(0,0,0,.1));pointer-events:none}
.logo{font-family:var(--cute);font-weight:700;font-size:clamp(32px,7vw,72px);color:#fffdf8;letter-spacing:2px;line-height:1.1;
  text-shadow:2px 2px 0 #7a5a40,4px 4px 0 rgba(122,90,64,.3),0 0 24px rgba(247,223,154,.6)}
.logo .accent{color:var(--pink);font-style:italic}
.logoMeta{margin-top:16px;color:#fffdf8;font-size:14px;letter-spacing:2px;text-align:center;line-height:2;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:rgba(90,60,40,.5);padding:8px 18px;border-radius:12px;border:1px solid rgba(247,223,154,.25);backdrop-filter:blur(4px);display:inline-block}
.logoMeta b{color:#f7df9a;font-weight:bold}
/* 介绍屏 */
#scr-intro{z-index:11;background:linear-gradient(to bottom,rgba(253,244,230,.35),rgba(253,244,230,.92))}
#introBox{max-width:min(520px,88vw);padding:26px 24px;text-align:center}
#introTitle{font-family:var(--cute);font-weight:700;font-size:24px;color:var(--warm2);letter-spacing:1px;margin-bottom:16px}
#introBody{font-size:15px;line-height:2;color:var(--txt);margin-bottom:20px}
#introBody .hl{color:var(--warm2);font-weight:bold}
#introBody .g{color:var(--green);font-weight:bold}
#introBody .r{color:var(--red);font-weight:bold}
#btnIntro{background:linear-gradient(180deg,var(--warm),var(--warm2));border:2px solid var(--warm2);color:#fff;font-weight:bold;
  padding:11px 26px;font-size:15px;letter-spacing:3px;border-radius:999px;box-shadow:0 4px 14px rgba(232,147,74,.32);text-shadow:0 1px 0 rgba(0,0,0,.12)}

.titleBtns{margin-top:28px;display:flex;flex-direction:column;gap:12px;width:min(300px,80vw)}
.btn{background:rgba(255,253,248,.95);border:2px solid var(--line);color:var(--txt);padding:12px 0;text-align:center;
  font-size:16px;letter-spacing:3px;border-radius:12px;transition:all .18s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadowSm),inset 0 1px 0 rgba(255,255,255,.9);
  position:relative;overflow:hidden}
.btn:hover:not(:disabled){border-color:var(--warm);background:var(--warm);color:#fff;transform:translateY(-2px);box-shadow:0 6px 18px rgba(232,147,74,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 2px 6px rgba(232,147,74,.3),inset 0 2px 4px rgba(0,0,0,.1)}
.btn.ghost:hover:not(:disabled){border-color:var(--dim);background:rgba(253,242,224,.95);color:var(--txt)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .small{font-size:12px;color:var(--dim);display:block;letter-spacing:1px;margin-top:4px;font-weight:normal}
.btn:hover .small{color:rgba(255,255,255,.85)}
.btn.primary{background:linear-gradient(180deg,var(--warm),var(--warm2));border-color:var(--warm2);color:#fff;font-weight:bold;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.primary:hover{background:linear-gradient(180deg,#f0a858,var(--warm2))}

/* 身份屏 */
#scr-id{background:rgba(253,244,230,.94);justify-content:flex-start;overflow:auto}
#idBox{width:min(780px,94vw);margin:auto;max-height:94vh;overflow:auto;padding:0 0 8px}
#idTop{padding:18px 22px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(180deg,#fffdf8,#fdf3e0)}
#portrait{width:180px;aspect-ratio:16/10;border-radius:12px;border:2px solid var(--line);box-shadow:var(--shadowSm)}
#idTopTxt{flex:1;min-width:220px}
#idTopTxt .t{font-family:var(--pix);font-size:15px;color:var(--warm2);letter-spacing:2px}
#idTopTxt .s{margin-top:6px;font-size:13px;color:var(--dim);line-height:1.8}
#idInit{margin-top:8px;font-size:14px;line-height:2;color:var(--dim)}
#idInit b{color:var(--txt);font-weight:bold}
#idInit .g{color:var(--green);font-weight:bold}
#idFields{padding:8px 22px 0}
.idField{padding:14px 0;border-bottom:1px dashed var(--line)}
.idField label{display:block;font-size:13px;color:var(--warm2);font-weight:bold;margin-bottom:10px;letter-spacing:1px}
.idField label b{color:var(--txt);font-weight:bold}
.idInput{width:100%;background:#fff;border:2px solid var(--line);color:var(--txt);padding:11px 14px;font-size:16px;border-radius:10px;letter-spacing:1px;transition:all .15s}
.idInput:focus{outline:none;border-color:var(--warm);box-shadow:0 0 0 3px rgba(232,147,74,.15)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:#fff;border:2px solid var(--line);color:var(--txt);padding:9px 15px;font-size:14px;border-radius:10px;transition:all .12s}
.chip:hover{border-color:var(--warm);transform:translateY(-1px)}
.chip.on{border-color:var(--warm);color:var(--warm2);background:#fff4e4;font-weight:bold;box-shadow:0 0 0 3px rgba(232,147,74,.15)}
.chip .mini{display:block;font-size:11px;color:var(--dim);font-weight:normal;margin-top:2px}
.chip.locked{opacity:.5;position:relative}
.chip.locked:after{content:'通关后解锁';font-size:10px;color:var(--red);margin-left:5px}
#btnStart{margin:18px 22px 6px;background:linear-gradient(180deg,var(--warm),var(--warm2));border:2px solid var(--warm2);color:#fff;font-weight:bold;padding:14px;font-size:17px;letter-spacing:8px;border-radius:12px;text-shadow:0 1px 0 rgba(0,0,0,.15);box-shadow:0 4px 12px rgba(232,147,74,.3),inset 0 1px 0 rgba(255,255,255,.3)}
#btnStart:hover{background:linear-gradient(180deg,#f0a858,var(--warm2));transform:translateY(-1px);box-shadow:0 6px 18px rgba(232,147,74,.4)}
#btnStart:active{transform:translateY(1px)}
#idWarn{color:var(--red);font-size:13px;min-height:16px;padding:0 22px 4px}

/* 游戏屏 */
#scr-game{background:var(--bg);justify-content:flex-start;overflow:auto;padding:0}
#statStrip{width:100%;background:linear-gradient(180deg,rgba(255,253,248,.98),rgba(253,242,224,.95));border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;font-size:13px;
  box-shadow:var(--shadow),inset 0 -1px 0 rgba(255,255,255,.9);position:sticky;top:0;z-index:5}
.stat{flex:1;min-width:140px;padding:10px 16px;border-right:1px solid var(--line);white-space:nowrap}
.stat:last-child{border-right:none}
.stat .k{color:var(--dim);font-size:11px;letter-spacing:2px}
.stat .v{color:var(--txt);font-size:20px;margin-top:3px;font-weight:bold;font-family:var(--pix)}
.stat .v.pos{color:var(--green)} .stat .v.neg{color:var(--red)} .stat .v.warm{color:var(--warm2)}
#gameMain{width:min(1100px,98vw);margin:14px auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
#sceneCard{padding:12px;background:linear-gradient(180deg,#fffdf8,#fdf3e0);border-radius:16px;border:2px solid var(--line);box-shadow:var(--shadowLg),inset 0 1px 0 rgba(255,255,255,.9)}
#scenTitle{font-size:17px;color:var(--warm2);font-weight:bold;letter-spacing:1px;padding:14px 4px 4px}
#scenText{font-size:15px;line-height:2;color:var(--txt);padding:4px 4px 10px;min-height:44px;white-space:pre-wrap;font-weight:500}
#optList{padding:0 4px 4px;display:flex;flex-direction:column;gap:9px}
#scenAsk{font-size:13px;color:var(--warm2);font-weight:bold;padding:2px 4px 10px;letter-spacing:1px}
#scenAsk::before{content:'💭 '}
.opt{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(253,246,234,.95));border:2px solid var(--line);color:var(--txt);padding:13px 15px;text-align:left;
  font-size:15px;line-height:1.7;border-radius:12px;transition:all .18s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadowSm),inset 0 1px 0 rgba(255,255,255,.9)}
.opt .optTop{display:flex;gap:12px;align-items:flex-start;width:100%}
.opt .ol{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,var(--pink),var(--pink2));color:#fff;font-weight:bold;
  display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px;text-shadow:0 1px 0 rgba(0,0,0,.15);box-shadow:0 2px 6px rgba(200,100,120,.25)}
.opt .od{flex:1}
.opt:hover:not(:disabled){border-color:var(--warm);transform:translateY(-2px);box-shadow:0 6px 16px rgba(232,147,74,.22)}
.opt:disabled{opacity:.6;cursor:default}
.opt.sel{opacity:1;border-color:var(--warm);background:linear-gradient(180deg,#fff4e4,#ffe8cc);box-shadow:0 0 0 3px rgba(232,147,74,.18),var(--shadowSm)}
.opt.sel .ol{background:linear-gradient(180deg,var(--warm),var(--warm2))}
/* 选项内对比 */
.opt .cmp{padding:10px 12px 4px;margin:0 -2px -2px;border-top:1px dashed var(--line);border-radius:0 0 10px 10px;background:rgba(253,246,234,.7);display:none}
.opt.answered .cmp{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.opt .dchips{flex:1;display:flex;flex-wrap:wrap;gap:5px 6px;min-width:0}
.opt .dchip{font-size:11.5px;padding:2px 7px;border-radius:999px;font-weight:bold;letter-spacing:.3px;line-height:1.5}
.opt .dchip.up{background:#e6f4da;color:var(--green2);border:1px solid #b9d9a8}
.opt .dchip.dn{background:#fbe4df;color:var(--red2);border:1px solid #eec4b8}
.opt .pnProfit{flex:none;background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 10px;text-align:center;min-width:86px;box-shadow:var(--shadowSm)}
.opt .pnProfit.pos{background:linear-gradient(180deg,#f2fbe8,#e4f5d0);border-color:#a8c888}
.opt .pnProfit.neg{background:linear-gradient(180deg,#fbe4df,#f9d4cc);border-color:#d9a090}
.opt .pnProfit .pv{font-family:var(--pix);font-size:16px;font-weight:bold;line-height:1.2}
.opt .pnProfit.pos .pv{color:var(--green2)} .opt .pnProfit.neg .pv{color:var(--red2)}
.opt .pnProfit .pl{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:1px}
.opt .selTag{display:none;flex:none;font-size:11px;background:var(--warm);color:#fff;padding:2px 8px;border-radius:999px;font-weight:bold;letter-spacing:1px;align-self:center}
.opt.answered.sel .selTag{display:inline-block}
#explainBox{display:none;margin:4px 4px 0;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,#f2fbe8,#e8f5d8);border:2px solid #cde3b8;box-shadow:var(--shadowSm)}
#explainBox.on{display:block;animation:fadeInUp .3s ease}
#explainBox .et{font-size:13px;color:#5a8a3e;font-weight:bold;margin-bottom:6px;letter-spacing:1px}
#explainBox .en{font-size:14px;line-height:1.95;color:#4a6a38}
#resultNote{margin:4px 4px 0;padding:14px 18px;border-radius:12px;background:linear-gradient(135deg,#fff4e4,#ffe8cc);border:2px solid #f2d9b0;font-size:14px;line-height:1.8;color:var(--txt);box-shadow:var(--shadowSm)}
#resultNote .rnNarr{margin-bottom:8px;font-size:13px;line-height:1.7;color:var(--warm2);font-style:italic}
#resultNote .rnBig{font-size:30px;font-weight:bold;text-align:center;line-height:1.3;letter-spacing:2px}
#resultNote .rnBig.pos{color:var(--green)} #resultNote .rnBig.neg{color:var(--red)}
#resultNote .rnBig .rnTag{display:block;font-size:11px;font-weight:normal;color:var(--dim);letter-spacing:2px;margin-top:4px}
#resultNote .rnCum{text-align:center;font-size:14px;margin-top:8px;color:var(--dim)}
#resultNote .rnCum b.pos{color:var(--green)} #resultNote .rnCum b.neg{color:var(--red)}
#modeDesc{margin:2px 4px 0;padding:10px 14px;border-radius:10px;background:#fdf6ea;border:1px dashed var(--amber);font-size:13px;line-height:1.95;color:var(--warm2)}
#modeDesc b{color:var(--warm)}
#btnHint{display:none;margin:10px 4px 0;background:#fff;border:2px dashed var(--amber);color:var(--warm2);
  padding:11px 16px;font-size:14px;border-radius:10px;transition:all .15s;letter-spacing:1px;width:100%;text-align:center}
#btnHint:hover:not(:disabled){background:#fff4e4;border-color:var(--warm);transform:translateY(-1px);box-shadow:var(--shadowSm)}
#btnHint:disabled{opacity:.55;cursor:default}
#btnSettle2{display:none;margin:14px 4px 6px;background:linear-gradient(180deg,var(--warm),var(--warm2));border:2px solid var(--warm2);color:#fff;
  font-weight:bold;padding:14px;font-size:17px;letter-spacing:6px;border-radius:12px;width:100%;text-shadow:0 1px 0 rgba(0,0,0,.15);box-shadow:0 4px 12px rgba(232,147,74,.3)}
#btnSettle2:hover{background:linear-gradient(180deg,#f0a858,var(--warm2));transform:translateY(-1px);box-shadow:0 6px 18px rgba(232,147,74,.4)}
/* 状态小条 */
#miniStats{margin-top:14px;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,#fffdf8,#fdf3e0);border:2px solid var(--line);
  display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;box-shadow:var(--shadowSm),inset 0 1px 0 rgba(255,255,255,.9)}
#miniStats .ms .k{color:var(--dim);font-size:12px}
#miniStats .ms .v{color:var(--warm2);font-weight:bold;font-family:var(--pix);margin-left:5px}
#goalLine{margin-top:10px;font-size:13px;color:var(--dim);line-height:1.7}
#goalLine b{color:var(--warm2)}

/* 结算弹层 */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(120,80,40,.35);backdrop-filter:blur(6px)}
#modal.on{display:flex;animation:fadeIn .3s ease}
#modalBox{width:min(440px,92vw);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#fffdf8,#fdf3e0);border-radius:18px;border:2px solid var(--line);
  box-shadow:0 16px 48px rgba(140,90,40,.35)}
#modalBox .panelTitle{font-size:15px;font-family:var(--pix);color:var(--warm2);letter-spacing:2px;padding:16px 20px 8px}
#settleBody{padding:4px 20px 12px;font-size:14px;line-height:2}
#settleBody .row{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:4px 0}
#settleBody .row .k{color:var(--dim)} #settleBody .row .v{color:var(--txt);font-weight:bold}
#settleBody .row.total{border:none;font-size:17px;padding-top:10px}
#settleBody .row.total .v.pos{color:var(--green)} #settleBody .row.total .v.neg{color:var(--red)}
#settleBody .warnLine{color:var(--red);font-size:13px;margin-top:8px}
#settleBody .okLine{color:var(--green);font-size:13px;margin-top:8px}
#btnSettle{width:100%;border:none;border-top:2px solid var(--line);background:linear-gradient(180deg,var(--warm),var(--warm2));color:#fff;
  font-weight:bold;padding:14px;font-size:16px;letter-spacing:6px;border-radius:0 0 16px 16px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
#btnSettle:hover{background:linear-gradient(180deg,#f0a858,var(--warm2))}

/* 浮动小提示 */
#fxLayer{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}
.fxchip{position:absolute;font-size:13px;font-weight:bold;letter-spacing:1px;animation:fxup 1.5s ease forwards;white-space:nowrap;
  background:rgba(255,255,255,.98);border:2px solid var(--line);border-radius:8px;padding:3px 8px;box-shadow:0 4px 12px rgba(200,150,90,.25)}
.fxchip.p{color:var(--green);border-color:#b9d9a8} .fxchip.m{color:var(--red);border-color:#eec4b8} .fxchip.n{color:var(--warm2);border-color:#f2d9b0}
@keyframes fxup{0%{opacity:0;transform:translateY(10px) scale(.9)}12%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 结果屏 */
#scr-result{background:linear-gradient(180deg,rgba(253,244,230,.95),rgba(247,234,213,.95));justify-content:flex-start;overflow:auto}
#resBox{width:min(680px,94vw);margin:auto;max-height:96vh;overflow:auto;padding:0 0 10px}
#resTitle{font-family:var(--pix);font-size:24px;letter-spacing:2px;padding:24px 24px 12px;text-align:center}
#resTitle.win{color:var(--green)} #resTitle.lose{color:var(--red)} #resTitle.over{color:var(--amber)}
#resTitle .sub{font-family:var(--sans);font-size:15px;color:var(--dim);letter-spacing:1px;margin-top:8px;font-weight:normal}
#resStats{padding:14px 24px;font-size:15px;line-height:2.2;background:linear-gradient(180deg,#fffdf8,#fdf3e0);margin:0 24px;border-radius:12px;border:2px solid var(--line);box-shadow:var(--shadowSm)}
#resStats b{color:var(--warm2);font-weight:bold}
/* 玩家类型卡片 */
#resType{margin:0 24px 12px;padding:18px 20px;border-radius:14px;background:linear-gradient(135deg,#fff8e8,#fdf0d8);border:2px solid var(--amber);box-shadow:var(--shadowSm);text-align:center}
#resType .typeIcon{font-size:40px;margin-bottom:6px}
#resType .typeName{font-family:var(--cute);font-weight:700;font-size:22px;color:var(--warm2);letter-spacing:2px;margin-bottom:4px}
#resType .typeTag{display:inline-block;font-size:12px;color:#fff;background:var(--warm2);padding:3px 12px;border-radius:999px;letter-spacing:1px;margin-bottom:8px}
#resType .typeDesc{font-size:14px;line-height:2;color:var(--txt);max-width:380px;margin:0 auto}
#resType .typeBars{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-width:320px;margin-left:auto;margin-right:auto}
#resType .typeBar{display:flex;align-items:center;gap:8px;font-size:12px;width:100%}
#resType .typeBar .bn{flex:0 0 80px;text-align:right;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#resType .typeBar .bt{flex:1 1 auto;min-width:0;height:10px;background:#f0e0c8;border-radius:5px;overflow:hidden;display:block}
#resType .typeBar .bf{display:block;height:100%;border-radius:5px;transition:width .6s ease;background:var(--green2)}
#resType .typeBar .bv{flex:0 0 28px;text-align:right;color:var(--warm2);font-weight:bold;font-size:11px}
/* 知识汇总 */
#resKnowledge{margin:0 24px 12px;padding:16px 20px;border-radius:14px;background:linear-gradient(180deg,#f0f8e8,#e8f5d8);border:2px solid #cde3b8;box-shadow:var(--shadowSm)}
#resKnowledge .kt{font-family:var(--cute);font-weight:700;font-size:16px;color:#5a8a3e;letter-spacing:1px;margin-bottom:10px}
#resKnowledge .ki{padding:8px 0;border-bottom:1px dashed #cde3b8}
#resKnowledge .ki:last-child{border-bottom:none}
#resKnowledge .ki .kn{font-size:13px;font-weight:bold;color:#5a8a3e;margin-bottom:2px}
#resKnowledge .ki .ke{font-size:13px;line-height:1.8;color:#4a6a38}
#resFootprint{padding:16px 24px;font-size:14px;line-height:2.1;color:var(--txt)}
#resFootprint .ft{font-family:var(--pix);font-size:13px;color:var(--warm2);letter-spacing:2px;margin-bottom:8px}
#resFootprint span.hl{color:var(--warm2);font-weight:bold}
#resRuns{font-size:13px;line-height:2.1;color:var(--dim);padding:0 24px}
#resBtns{display:flex;flex-direction:column;gap:12px;width:100%;padding:18px 24px 8px}
#resBtns .btn{width:100%}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--panel2)}
::-webkit-scrollbar-thumb{background:#d4b890;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#c8a878}
@media (max-width:900px){
  #gameMain{grid-template-columns:1fr}
  #subInner{font-size:16px}
  .stat{min-width:33.3%}
}
/* 移动端更小屏：字号缩到 16px、按钮最小 44px 触控、避免横向溢出 */
@media (max-width:560px){
  html,body{font-size:16px;overflow-x:hidden}

  #app{min-height:100dvh;overflow-x:hidden}

  #subInner{padding:10px 16px;font-size:15px;line-height:1.55}

  .logoMeta{font-size:14px;padding:0 20px}
  .titleBtns{padding:0 24px;gap:10px}
  .btn{min-height:44px;font-size:16px;padding:10px 18px}
  .panel{border-radius:10px;padding:14px 16px}

  .chip{min-height:40px;font-size:15px;padding:8px 14px}
  .fld{padding:10px 14px;min-height:44px;border-radius:8px}
  .opt{min-height:52px;padding:10px 14px;border-radius:10px}
  .scn{padding:14px 16px}
  .scnT{font-size:17px}
  .scnD{font-size:15px;line-height:1.6}
  .stat{padding:8px 10px;font-size:13px;white-space:normal}
  .stat v{font-size:18px}
  #mini{height:90px}
  #logBox{min-height:120px;font-size:14px}
  #logHeader{font-size:14px}
  h3{font-size:16px}
  .miniCanvas{height:90px}
  .gLine{grid-template-columns:48px 1fr;gap:10px}
  .gVal{font-size:15px}
  .fxchip{font-size:13px;padding:6px 10px}
  #explainBox{margin:14px 16px 0 16px}
  #explainBox h4{font-size:15px}
  #explainTxt{font-size:14px;line-height:1.6}
  #btnHint{min-height:38px}
  #btnNext{min-height:46px;font-size:16px}
  #goalBox{margin:0 16px}
  #goalTxt{font-size:14px}
  .goalLine{height:12px}
  #langBtn{top:10px;right:10px;font-size:12px;padding:7px 12px}
  #sceneBG{image-rendering:-webkit-optimize-contrast}
  #portrait{image-rendering:-webkit-optimize-contrast}
  input,select,textarea{font-size:16px}
}
@media (max-width:380px){
  .logo{font-size:26px;letter-spacing:2px}

  .opt{font-size:14px}
}
/* 防 iOS 橡皮筋 + 横向溢出 */
#app{overflow-x:hidden;max-width:100vw}
body{overflow-x:hidden}
/* 可点击元素统一最小点击面积 */
button,input[type=text],.chip,.opt{-webkit-appearance:none;-moz-appearance:none;appearance:none;touch-action:manipulation}

/* 防选中文字（按钮/芯片）闪烁 */
.btn,.chip,.opt,canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}

<body>
<div id="app">
  <canvas id="sceneBG" width="320" height="180"></canvas>

      <button class="btn ghost" id="btnReset" data-i18n="btnReset">重置存档</button>
    </div>
  </section>

      <button id="btnIntro" data-i18n="btnIntro">明白了，开始故事 ▸</button>

function t(key){const v=I18N[key];return v? v[LANG]||v.zh : key;}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[k])el.textContent=t(k);});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{const k=el.getAttribute('data-i18n-html');if(I18N[k])el.innerHTML=t(k);});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{const k=el.getAttribute('data-i18n-ph');if(I18N[k])el.placeholder=t(k);});
  document.documentElement.lang=LANG==='en'?'en':'zh-CN';
  $('langBtn').textContent=LANG==='en'?'中文 / EN':'中 / EN';
}
function rebuildLog(){
  if(!S||!S._logData) return;
  const body=$('logBody'); body.innerHTML='';
  for(let i=S._logData.length-1;i>=0;i--){
    const e=S._logData[i]; let txt='';
    if(e.type==='i18n'){ txt=t(e.k); if(e.vars)for(const k in e.vars)txt=txt.replace('%'+k+'%',e.vars[k]); }
    else if(e.type==='ev'){ const arr=EVENTS(); const ev=arr.find(x=>x.id===e.id); txt=t('logMarket')+(ev?ev.t:e.fb); }
    else if(e.type==='scen'){ try{ const sc=SCEN()[e.si]; const o=sc.o[e.oi]; txt=t('logChoose')+o.l+t('logChoose2'); }catch(err){txt=e.fb||'';} }
    else if(e.type==='settle'){ txt=t('logProfit')+fmtS(e.p)+t('logMonthlyCum')+fmtS(e.tp)+t('logMonthlyCum2'); }
    else if(e.type==='stage'){ txt=t('logStage')+e.m+t('logStage2')+e.tm+t('logStage3'); }
    else if(e.type==='raw'){ txt=e.t; }
    else if(e.type==='warn'){ txt='⚠ '+t(e.k); }
    else if(e.type==='welcome'){ txt=t('logWelcome')+e.n+t('logWelcome2'); }
    else if(e.type==='hint'){ txt=t('logBuyHint')+fmtI(e.p)+t('logBuyHint2'); }
    else if(e.type==='wave'){ txt=t('logMarketWave')+e.parts.map(p=>(p.v>=0?'+':'')+Math.round(p.v)+' '+(FX_LABEL()[p.k]||p.k)).join(' · '); }
    if(txt){ const d=document.createElement('div'); d.style.padding='2px 0'; d.textContent=txt; body.appendChild(d); }
  }
  while(body.children.length>12) body.removeChild(body.lastChild);
}
function toggleLang(){
  LANG=LANG==='zh'?'en':'zh';
  localStorage.setItem('pixelShop.lang',LANG);
  applyI18n();
  if(curScreen==='title')refreshTitle();
  else if(curScreen==='id'){buildChips();drawPortrait();refreshInit();}
  else if(curScreen==='game'){renderAll();showScen();rebuildLog();}
  else if(curScreen==='result')showResult();
}

/* ---------------- 音乐引擎（柔和芯片音乐） ---------------- */
const Midi=n=>440*Math.pow(2,(n-69)/12);
const AudioEngine={
  ctx:null, master:null, timer:null, current:null, muted:false,
  init(){ if(this.ctx) return;
    try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    this.master=this.ctx.createGain(); this.master.gain.value=0.22; this.master.connect(this.ctx.destination);
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  _tone(type,freq,start,dur,vol,dest){
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,start);
    g.gain.exponentialRampToValueAtTime(vol,start+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    o.connect(g); g.connect(dest||this.master);
    o.start(start); o.stop(start+dur+0.05);
  },
  playSong(name){
    if(!this.ctx||this.muted){ this.current=name; return; }
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    const s=SONGS[name]; if(!s) return;
    this.current=name;
    const step=60/s.bpm, look=0.18;
    let nextT=this.ctx.currentTime+0.06, idx=[0,0,0,0], trackT=[0,0,0,0];
    const tick=()=>{
      for(let tr=0;tr<s.tracks.length;tr++){
        const t=s.tracks[tr], seq=t.seq;
        while(trackT[tr] < this.ctx.currentTime-nextT+look){
          const ev=seq[idx[tr]%seq.length];
          if(ev[0]!==null){
            const dur=ev[1]*step;
            if(ev[0]===0){ this._noise(nextT,dur,t.vol); }
            else this._tone(t.type,Midi(ev[0]),nextT,dur,t.vol);
          }
          trackT[tr]+=ev[1]*step;
          idx[tr]++;
          if(idx[tr]>=seq.length) idx[tr]=0;
        }
      }
      nextT+=step/2;
    };
    this.timer=setInterval(tick,50);
    tick();
  },
  _noise(t,dur,vol){
    const len=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain(); g.gain.value=vol;
    src.connect(g); g.connect(this.master); src.start(t);
  },
  sfx(name){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime;
    const f=(n,d,v,type)=>{ if(n) this._tone(type||'triangle',Midi(n),t,d,v); };
    switch(name){
      case 'click': f(80,.08,.07); break;
      case 'coin': f(83,.1,.09); f(88,.12,.07,'triangle'); break;
      case 'buy': f(76,.1,.09); f(83,.13,.08); break;
      case 'hurt': f(64,.3,.07); f(55,.35,.05); break;
      case 'win': [72,76,79,84,88].forEach((n,i)=>setTimeout(()=>this._tone('triangle',Midi(n),this.ctx.currentTime,.16,.08),i*100)); break;
      case 'lose': [72,69,64,57].forEach((n,i)=>setTimeout(()=>this._tone('sawtooth',Midi(n),this.ctx.currentTime,.2,.04),i*120)); break;
      case 'cash': f(84,.06,.06); f(91,.07,.05,'triangle'); break;
    }
  }
};

function putSprite(ctx,map,pal,x,y,flip){
  for(let r=0;r<map.length;r++){
    const row=map[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c]; if(ch==='.'||ch===' ') continue;
      const col=pal[ch]; if(!col) continue;
      ctx.fillStyle=col; ctx.fillRect(x+(flip?row.length-1-c:c),y+r,1,1);
    }
  }
}

function drawGirl(ctx,x,y,t,pose){const tm=t;
  let fr=SPR_G_A, bob=0;
  if(pose==='walk'){ fr=(Math.floor(tm*4)%2)?SPR_G_B:SPR_G_A; bob=(Math.floor(tm*4)%2)?1:0; }
  putSprite(ctx,fr,PAL_G,x,y+bob);
  // 双马尾（紧贴脑袋两侧，1px 与深棕头发 H 重叠，保证无悬空连接）
  const sw=Math.floor(Math.sin(tm*3))*0;
  // 左马尾：cols [x,x+1,x+2]，x+2 覆盖 sprite col 2 (H 深棕头发)
  R(ctx,x,   y+2+sw, 3, 6, PAL_G.X);
  // 右马尾：cols [x+9,x+10,x+11]，x+9 覆盖 sprite col 9 (H 深棕头发)

const FX_LABEL=()=>({demand:t('fxDemand'),price:t('fxPrice'),rep:t('fxRep'),cust:t('fxCust'),emp:t('fxEmp'),supp:t('fxSupp'),comm:t('fxComm'),cash:t('fxCash')});
function applyFx(fx,from){
  const parts=[];
  for(const k in fx){
    const v=(typeof fx[k]==='function')?fx[k]():fx[k];
    if(k==='demand'){ S.demand=clamp(S.demand+v,10,130); }
    else if(k==='price'){ S.price=clamp(S.price+v,0.6,1.6); }
    else if(k==='rep'){ S.rep=clamp(S.rep+v,0,100); }
    else if(k==='cust'){ S.cust=clamp(S.cust+v,0,100); }
    else if(k==='emp'){ S.emp=clamp(S.emp+v,0,100); }
    else if(k==='supp'){ S.supp=clamp(S.supp+v,0,100); }
    else if(k==='comm'){ S.comm=clamp(S.comm+v,0,100); }
    else if(k==='cash'){ S.cash+=v; }
    else if(k==='costExtra'){ S.mods.costExtra=clamp(S.mods.costExtra+v,-0.08,0.12); }
    else if(k==='fixedExtra'){ S.mods.fixedExtra=clamp(S.mods.fixedExtra+v,0,4000); }
    else if(k==='loanPay'){ S.mods.loanPay+=v; }
    parts.push({k, label:FX_LABEL()[k]||k, v});
  }
  if(from&&parts.length) addLog({type:'wave', parts: parts.map(p=>({k:p.k,v:p.v}))});
  spawnChips(parts);
  AudioEngine.sfx(fx.cash>0?'cash':(fx.cash<0?'buy':'click'));
}
/* —— 环节结算（每环节 = 3 天，10 环节 = 1 个月） —— */
function settle(){
  const cfg=SHOP_CFG[S.shopType];
  const d=clamp(S.demand,0,130), r=clamp(S.rep,0,100);
  const flow=cfg.baseFlow*(d/100)*(0.5+r/100*0.5);
  const priceA=cfg.basePrice*clamp(S.price,0.6,1.6);
  const days=3;
  const revenue=flow*priceA*days;
  const purch=revenue*cfg.pur*(1.2-clamp(S.supp,0,100)/250)+revenue*S.mods.costExtra;
  const fixed=(cfg.fixed+S.mods.fixedExtra)*days/30;
  // —— 忙时成本：客流越多，加班费/临时工/额外管理成本越高（压缩高盈利空间，让成本与收入成比例）
  const busyCost=revenue*0.035;
  const labor=EMP*4700*(1.1-clamp(S.emp,0,100)/200)*days/30 + busyCost;
  const overdraft=S.cash<0 ? -S.cash*0.035 : 0;   // 现金透支按 3.5%/环节 罚息
  const expense=fixed+Math.max(0,purch)+labor+overdraft+S.mods.loanPay*days/30;
  let profit=revenue-expense;
  // —— 经营调节：单环节利润超 ¥100 的部分加征 30% 杂项损耗
  // 现实含义：小赚正常，大赚阶段隐性成本上升更快
  const slackTax=(profit>100)? Math.round((profit-100)*0.30) : 0;
  if(slackTax>0){ profit-=slackTax; }
  S.cash+=profit;
  S.revenue=revenue; S.expense=expense; S.profit=profit;
  S.totalProfit+=profit; S.totalRev+=revenue; S.totalExp+=expense;
  S.peakProfit=Math.max(S.peakProfit,profit);
  if(profit<0) S.losses++; else S.losses=0;
  S.series.cash.push(S.cash);
  S.series.profit.push(profit);
  const decay=[];
  if(S.price>1.3){ S.demand-=2; S.cust-=2; decay.push(t('decayPrice')); }
  if(S.emp<40){ S.cust-=2; decay.push(t('decayEmp')); }
  if(S.cust<40){ S.demand-=2; decay.push(t('decayCust')); }
  if(S.supp<30){ S.mods.costExtra=Math.min(0.12,S.mods.costExtra+0.01); decay.push(t('decaySupp')); }
  S.demand=clamp(S.demand,10,130); S.cust=clamp(S.cust,0,100);
  return {flow,priceA,revenue,purch,fixed,labor,expense,profit,decay};
}

let lastSettle=null;
function choose(opt,oi,b){
  const si=S.month-1; const sc=SCEN()[si];
  // 1. 保存before快照（用于所有选项的对比计算）
  S._beforeSnap=snapshotState2();
  if(!S._chosenOpts) S._chosenOpts=[]; S._chosenOpts.push({si, oi});
  const fb=t('logChoose')+(opt.l||'')+t('logChoose2');
  addLog({type:'scen', si, oi, fb});
  // 2. 经济小课堂
  $('explainTxt').textContent=sc.explain;
  $('explainBox').classList.add('on');
  $('btnHint').style.display='none';
  // 3. 应用影响 + 浮动数字
  applyFx(opt.fx);
  AudioEngine.sfx('coin');
  renderMini();
  // 4. 内部结算
  addLog({type:'stage', m:S.month, tm:MAX_MONTH});
  const r=settle();
  lastSettle=r;
  addLog({type:'settle', p:r.profit, tp:S.totalProfit});
  r.decay.forEach(tx=>addLog({type:'raw', t:'⚠ '+tx}));
  S.answeredMonth=S.month;
  // 5. 重新渲染所有选项（此时每个选项上都直接显示对比）
  const before=S._beforeSnap;
  const box=$('optList'); box.innerHTML='';
  sc.o.forEach((o,i)=>{
    const bb=document.createElement('button');
    bb.className='opt answered'+(i===oi?' sel':'');
    bb.disabled=true;
    bb.innerHTML='<div class="optTop"><span class="ol">'+String.fromCharCode(65+i)+'</span><span class="od">'+o.d+'</span>'+
      renderCmpHtml(o, S.shopType, before);
    box.appendChild(bb);
  });
  // 6. 结算卡：显示本题赚亏 + 累计
  const note=$('resultNote');
  note.style.display='block';
  note.innerHTML=
    '<div class="rnNarr">『'+opt.n+'』</div>'+
    '<div class="rnBig '+(r.profit>=0?'pos':'neg')+'">'+(r.profit>=0?'+':'')+'¥'+fmtI(r.profit)+
      '<span class="rnTag">'+(r.profit>=0?t('rnEarn'):t('rnLoss'))+'</span></div>'+
    '<div class="rnCum">'+t('rnCum')+'<b class="'+(S.totalProfit>=0?'pos':'neg')+'">'+(S.totalProfit>=0?'+':'')+'¥'+fmtI(S.totalProfit)+'</b></div>';
  nextMonthEvent();
  renderStats();
  const btn=$('btnSettle2'); btn.style.display='block'; btn.style.borderColor='var(--warm2)';
  if(S.cash<=BANKRUPT_LINE){ btn.textContent=t('btnEndRed'); btn.style.borderColor='var(--red)'; }
  else if(S.month>=MAX_MONTH){ btn.textContent=t('btnReport'); }
  else { btn.textContent=t('btnNextStage'); }
  saveGame();
}

function nextMonthEvent(){
  const pool=EVENTS().filter(e=>!S.usedEvents.includes(e.id));
  if(!pool.length) return;
  const ev=pool[Math.floor(Math.random()*pool.length)];
  S.usedEvents.push(ev.id);
  addLog({type:'ev', id:ev.id, fb:ev.t});
  applyFx(ev.fx);
}

function snapshotState2(){

    cash:S.cash,mods:{costExtra:S.mods.costExtra,fixedExtra:S.mods.fixedExtra,loanPay:S.mods.loanPay}};

function applyFxToClone(base, fx){
  const n=JSON.parse(JSON.stringify(base));
  for(const k in fx){
    const v=(typeof fx[k]==='function')?fx[k]():fx[k];
    if(k==='demand') n.demand=clamp(n.demand+v,10,130);
    else if(k==='price') n.price=clamp(n.price+v,0.6,1.6);
    else if(k==='rep') n.rep=clamp(n.rep+v,0,100);
    else if(k==='cust') n.cust=clamp(n.cust+v,0,100);
    else if(k==='emp') n.emp=clamp(n.emp+v,0,100);
    else if(k==='supp') n.supp=clamp(n.supp+v,0,100);
    else if(k==='comm') n.comm=clamp(n.comm+v,0,100);
    else if(k==='cash') n.cash+=v;
    else if(k==='costExtra') n.mods.costExtra=clamp(n.mods.costExtra+v,-0.08,0.12);
    else if(k==='fixedExtra') n.mods.fixedExtra=clamp(n.mods.fixedExtra+v,0,4000);
    else if(k==='loanPay') n.mods.loanPay+=v;
  }
  return n;
}
function simulateProfit(ns, shopType){
  const cfg=SHOP_CFG[shopType];
  const d=clamp(ns.demand,0,130), r=clamp(ns.rep,0,100);
  const flow=cfg.baseFlow*(d/100)*(0.5+r/100*0.5);
  const priceA=cfg.basePrice*clamp(ns.price,0.6,1.6);
  const days=3;
  const revenue=flow*priceA*days;
  const purch=revenue*cfg.pur*(1.2-clamp(ns.supp,0,100)/250)+revenue*ns.mods.costExtra;
  const fixed=(cfg.fixed+ns.mods.fixedExtra)*days/30;
  const busyCost=revenue*0.035;
  const labor=EMP*4700*(1.1-clamp(ns.emp,0,100)/200)*days/30 + busyCost;
  const overdraft=ns.cash<0 ? -ns.cash*0.035 : 0;
  const expense=fixed+Math.max(0,purch)+labor+overdraft+ns.mods.loanPay*days/30;
  let p=revenue-expense;
  const slackTax=(p>100)? Math.round((p-100)*0.30) : 0;
  if(slackTax>0){ p-=slackTax; }
  return p;
}
function formatOptDelta(opt, shopType, before){
  const after=applyFxToClone(before, opt.fx);
  const fxl=FX_LABEL();
  const chips=[];
  const addChip=(label,delta,isPct)=>{
    if(label==null||Math.abs(delta)<0.005) return;
    let dsp;
    if(isPct){ dsp=(delta>=0?'+':'')+(delta*100).toFixed(1)+'%'; }
    else if(label===t('fxCash')){ dsp=(delta>=0?'+':'-')+'¥'+fmtI(Math.abs(delta)); }
    else { dsp=(delta>=0?'+':'')+Math.round(delta); }
    chips.push({label,dsp,pos:delta>0});
  };
  addChip(fxl.demand, after.demand-before.demand);
  addChip(fxl.price, after.price-before.price, true);
  addChip(fxl.rep, after.rep-before.rep);
  addChip(fxl.cust, after.cust-before.cust);
  addChip(fxl.emp, after.emp-before.emp);
  addChip(fxl.supp, after.supp-before.supp);
  addChip(fxl.comm, after.comm-before.comm);
  addChip(fxl.cash, opt.fx.cash||0);
  const profit=simulateProfit(after, shopType);
  return {chips, profit};
}
function renderCmpHtml(opt, shopType, before){
  const {chips, profit}=formatOptDelta(opt, shopType, before);
  const chipsHtml=chips.map(c=>
    '<span class="dchip '+(c.pos?'up':'dn')+'">'+c.dsp+' '+c.label+'</span>'
  ).join('');
  const cls=profit>=0?'pos':'neg';
  const sign=profit>=0?'+':'-';
  const tag=LANG==='en'?'Est. profit':'预估净利';
  const selTagTxt=LANG==='en'?'Your pick':'你的选择';
  return '<span class="selTag">'+selTagTxt+'</span></div>'+
    '<div class="cmp"><div class="dchips">'+chipsHtml+'</div>'+
    '<div class="pnProfit '+cls+'"><div class="pv">'+sign+'¥'+fmtI(Math.abs(profit))+'</div><div class="pl">'+tag+'</div></div></div>';
}

function addLog(entry){
  let meta,txt='';
  if(typeof entry==='string'){ meta={type:'raw', t:entry}; txt=entry; }
  else{ meta=entry;
    if(meta.type==='ev'){ const arr=EVENTS(); const ev=arr.find(x=>x.id===meta.id); txt=t('logMarket')+(ev?ev.t:meta.fb); }
    else if(meta.type==='scen'){ try{ const sc=SCEN()[meta.si]; const o=sc.o[meta.oi]; txt=t('logChoose')+o.l+t('logChoose2'); }catch(err){txt=meta.fb||'';} }
    else if(meta.type==='settle'){ txt=t('logProfit')+fmtS(meta.p)+t('logMonthlyCum')+fmtS(meta.tp)+t('logMonthlyCum2'); }
    else if(meta.type==='stage'){ txt=t('logStage')+meta.m+t('logStage2')+meta.tm+t('logStage3'); }
    else if(meta.type==='raw'){ txt=meta.t; }
    else if(meta.type==='warn'){ txt='⚠ '+t(meta.k); }
    else if(meta.type==='welcome'){ txt=t('logWelcome')+meta.n+t('logWelcome2'); }
    else if(meta.type==='hint'){ txt=t('logBuyHint')+fmtI(meta.p)+t('logBuyHint2'); }
    else if(meta.type==='wave'){ txt=t('logMarketWave')+meta.parts.map(p=>(p.v>=0?'+':'')+Math.round(p.v)+' '+(FX_LABEL()[p.k]||p.k)).join(' · '); }
  }
  if(S&&S._logData){ S._logData.push(meta); if(S._logData.length>40) S._logData.shift(); }
  const div=document.createElement('div');
  div.style.padding='2px 0';
  div.textContent=txt;
  const body=$('logBody');
  body.insertBefore(div,body.firstChild);
  while(body.children.length>12) body.removeChild(body.lastChild);
}

/* —— 玩家类型系统（基于10题选择模式） —— */
// 每题3个选项映射到4种类型：saver / balanced / people / innovator
const TYPE_TAGS=[
  [0,1,2], // Scn1: saver, balanced, innovator(精品投资)
  [0,1,2], // Scn2: saver, people, balanced
  [0,1,2], // Scn3: saver, balanced, people
  [0,1,2], // Scn4: saver, innovator, people
  [0,1,2], // Scn5: saver, innovator, balanced
  [1,1,0], // Scn6: balanced, innovator, saver
  [2,1,0], // Scn7: innovator, people, saver
  [1,1,1], // Scn8: people, balanced, balanced(passive)
  [1,1,0], // Scn9: people, balanced, saver
  [0,2,1]  // Scn10: saver, innovator, balanced
];
const TYPE_KEYS=['saver','balanced','people','innovator'];
const TYPE_ICONS={saver:'⬇️',balanced:'⚖️',people:'🤝',innovator:'🚀'};
const TYPE_COLORS={saver:'var(--green2)',balanced:'var(--amber2)',people:'var(--pink2)',innovator:'var(--warm2)'};
function computeType(){
  const scores={saver:0,balanced:0,people:0,innovator:0};
  if(S._chosenOpts){
    S._chosenOpts.forEach(c=>{
      if(c.si>=0&&c.si<TYPE_TAGS.length&&c.oi>=0&&c.oi<3){
        const tag=TYPE_KEYS[TYPE_TAGS[c.si][c.oi]];
        if(tag) scores[tag]++;
      }
    });
  }
  // 找最高分；平局优先级：saver > balanced > people > innovator
  let best='saver',max=-1;
  TYPE_KEYS.forEach(k=>{ if(scores[k]>max){ max=scores[k]; best=k; } });
  return {scores,best};
}
function renderTypeCard(){
  const {scores,best}=computeType();
  const n=t('type'+best.charAt(0).toUpperCase()+best.slice(1)+'_n');
  const tag=t('type'+best.charAt(0).toUpperCase()+best.slice(1)+'_t');
  const d=t('type'+best.charAt(0).toUpperCase()+best.slice(1)+'_d');
  const icon=TYPE_ICONS[best];
  const total=Math.max(1,S._chosenOpts?S._chosenOpts.length:1);
  const bars=TYPE_KEYS.map(k=>{
    const pct=Math.round(scores[k]/total*100);
    return '<div class="typeBar"><span class="bn">'+t('type'+k.charAt(0).toUpperCase()+k.slice(1)+'_n')+'</span>'+
      '<span class="bt"><span class="bf" style="width:'+pct+'%;background:'+TYPE_COLORS[k]+'"></span></span>'+
      '<span class="bv">'+scores[k]+'</span></div>';
  }).join('');
  $('resType').innerHTML=
    '<div class="typeIcon">'+icon+'</div>'+
    '<div class="typeName">'+n+'</div>'+
    '<div class="typeTag">'+tag+'</div>'+
    '<div class="typeDesc">'+d+'</div>'+
    '<div class="typeBars">'+bars+'</div>';
}
